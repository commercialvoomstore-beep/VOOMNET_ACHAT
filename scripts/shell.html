<!-- ============================= ÉCRAN DE CONNEXION ============================= -->
<div id="login-screen">
  <div class="login-card">
    <img src="/voomnet-logo.png" alt="VOOMNET TECHNOLOGY" class="login-logo-img">
    <div class="login-sub">PORTAIL DE GESTION DES DEMANDES D'ACHATS</div>
    <form id="login-form" autocomplete="off">
      <div class="field" style="margin-bottom:14px">
        <label for="login-id">Identifiant</label>
        <input id="login-id" type="text" placeholder="Saisissez votre identifiant" required>
      </div>
      <div class="field">
        <label for="login-pw">Mot de passe</label>
        <input id="login-pw" type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn primary" style="width:100%;justify-content:center;margin-top:18px">Se connecter</button>
    </form>
    <div class="demo-box">
      <p>Comptes de démonstration</p>
      <button class="demo-chip" data-act="fill-login" data-u="admin" data-p="admin123"><span>Administrateur</span><code>admin / admin123</code></button>
      <button class="demo-chip" data-act="fill-login" data-u="demandeur" data-p="demo123"><span>Demandeur</span><code>demandeur / demo123</code></button>
      <button class="demo-chip" data-act="fill-login" data-u="responsable" data-p="demo123"><span>Responsable</span><code>responsable / demo123</code></button>
    </div>
  </div>
</div>

<!-- ============================= APPLICATION ============================= -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="sidebar-logo">
      <img src="/voomnet-logo.png" alt="VOOMNET TECHNOLOGY" class="sidebar-logo-img">
      <div><span>GESTION DES ACHATS</span></div>
    </div>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-user">
      <div class="avatar" id="su-avatar"></div>
      <div style="min-width:0">
        <div class="nm" id="su-name"></div>
        <div class="rl" id="su-role"></div>
      </div>
      <button data-act="logout" title="Se déconnecter" aria-label="Se déconnecter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>
  <div class="main">
    <header id="topbar">
      <button id="hamburger" data-act="toggle-sidebar" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 id="page-title">Tableau de bord</h1>
      <div class="bell-wrap">
        <button class="icon-btn" id="btn-son" data-act="toggle-son" title="Sons de notification">🔊</button>
        <button class="icon-btn" data-act="notif-toggle" title="Notifications" aria-label="Notifications">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="bell-badge" id="bell-badge" style="display:none">0</span>
        </button>
        <div class="notif-panel hidden" id="notif-panel"></div>
      </div>
      <div class="user-chip">
        <div class="avatar" style="width:28px;height:28px;font-size:11px" id="tu-avatar"></div>
        <div><div class="nm" id="tu-name"></div><div class="rl" id="tu-role"></div></div>
      </div>
    </header>
    <main id="page-content"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-root"></div>
