<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOOMNET — Gestion des Achats</title>
<!-- SheetJS (lecture/écriture Excel .xlsx). Sans Internet, l'application reste 100 % fonctionnelle en CSV et JSON. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Supabase (optionnel) : décommentez ce bloc et renseignez vos clés pour synchroniser les données
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->
<style>
/* ============================= DESIGN SYSTEM ERP ENTREPRISE ============================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#1e293b;--primary-dark:#0f172a;--accent:#3b0764;
  --navy:#0f172a;--navy2:#1e293b;
  --sidebar-bg:#0f172a;--sidebar-fg:#cbd5e1;--sidebar-border:#1e293b;
  --topbar-bg:#ffffff;
  --bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#cbd5e1;--border-light:#e2e8f0;
  --green:#15803d;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --red:#b91c1c;--red-bg:#fef2f2;--red-border:#fecaca;
  --amber:#b45309;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --orange:#c2410c;--orange-bg:#fff7ed;--orange-border:#fed7aa;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-border:#bfdbfe;
  --purple:#581c87;--purple-bg:#faf5ff;--purple-border:#e9d5ff;
  --teal:#0f766e;--teal-bg:#f0fdfa;--teal-border:#99f6e4;
  --gray:#475569;--gray-bg:#f8fafc;--gray-border:#cbd5e1;
  --radius:6px;
  --shadow:0 1px 2px rgba(15,23,42,.05);
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.45;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.text-muted{color:var(--muted)}
.small{font-size:12px}
.mt{margin-top:14px}

/* ============================= BOUTONS (STYLE PROGICIEL) ============================= */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid transparent;border-radius:var(--radius);
  padding:7px 14px;font-weight:500;font-size:13px;line-height:1.25;
  transition:background .12s,border-color .12s,color .12s;white-space:nowrap;
}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-dark)}
.btn.success{background:var(--green);color:#fff;border-color:var(--green)}
.btn.success:hover{filter:brightness(.93)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.danger:hover{filter:brightness(.93)}
.btn.warning{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn.warning:hover{filter:brightness(.93)}
.btn.outline{background:#fff;color:#334155;border:1px solid var(--border)}
.btn.outline:hover{background:#f8fafc;border-color:#94a3b8;color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-mini{
  background:#fff;border:1px solid var(--border);border-radius:5px;
  width:28px;height:28px;font-size:12px;color:#475569;
  display:inline-flex;align-items:center;justify-content:center;transition:.12s;
}
.icon-mini:hover{background:#f1f5f9;color:var(--text);border-color:#94a3b8}
.icon-mini svg{width:14px;height:14px}

/* ============================= ÉCRAN DE CONNEXION ============================= */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:#0f172a;
  background-image:radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 75%);
}
.login-card{
  background:#fff;border:1px solid var(--border);border-radius:8px;
  box-shadow:0 20px 40px rgba(0,0,0,.35);max-width:400px;width:100%;
  padding:34px 32px;text-align:center;
}
.login-logo-img{width:175px;max-width:75%;height:auto;margin:0 auto 12px;display:block}
.login-logo{
  width:56px;height:56px;border-radius:8px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
  color:#fff;font-weight:700;font-size:24px;
}
.login-title{font-size:22px;font-weight:700;letter-spacing:.5px}
.login-sub{
  color:var(--muted);font-weight:600;letter-spacing:1.8px;font-size:10.5px;
  margin-top:2px;padding-bottom:16px;border-bottom:1px solid var(--border-light);
}
.login-card form{margin-top:20px;text-align:left}
.demo-box{margin-top:20px;text-align:left;padding-top:14px;border-top:1px solid var(--border-light)}
.demo-box p{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.demo-chip{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  background:#f8fafc;border:1px solid var(--border);border-radius:6px;
  padding:7px 11px;margin-top:6px;font-size:12px;font-weight:500;transition:.12s;
}
.demo-chip:hover{border-color:var(--primary);background:#f1f5f9}
.demo-chip code{background:#e2e8f0;padding:2px 6px;border-radius:4px;color:var(--text);font-size:11px}

/* ============================= CHAMPS DE FORMULAIRE ============================= */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:#334155}
.field input,.field select,.field textarea{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 11px;font-size:13px;background:#fff;width:100%;color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:#334155;box-shadow:0 0 0 2px rgba(15,23,42,.10);
}
.field textarea{resize:vertical;min-height:72px}
.field .hint{font-size:11.5px;color:var(--muted)}
.field input[readonly]{background:#f8fafc;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.form-full{grid-column:1/-1}

/* ============================= STRUCTURE APPLICATION ============================= */
#app{display:flex;min-height:100vh}
#sidebar{
  width:244px;background:var(--sidebar-bg);color:var(--sidebar-fg);
  border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;
  position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .2s;
}
.sidebar-logo{
  display:flex;flex-direction:column;gap:8px;align-items:flex-start;
  padding:16px 18px;border-bottom:1px solid var(--sidebar-border);
}
.sidebar-logo img{width:100%;max-width:175px;height:auto;display:block;background:#fff;padding:5px 8px;border-radius:5px}
.sidebar-logo span{font-size:9.5px;color:#94a3b8;letter-spacing:1.6px;font-weight:600}
#sidebar nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-group{font-size:10px;letter-spacing:1.2px;color:#64748b;font-weight:700;padding:10px 12px 4px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;border-left:3px solid transparent;
  color:#94a3b8;padding:8px 11px;border-radius:4px;
  font-size:13px;font-weight:500;margin-bottom:2px;transition:.12s;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.04);color:#f8fafc}
.nav-item.active{
  background:#1e293b;color:#ffffff;font-weight:600;
  border-left-color:#38bdf8;
}
.nav-item.active svg{opacity:1;color:#38bdf8}
.nav-item .cnt{
  margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;
  border-radius:4px;padding:1px 6px;font-weight:700;
}
.sidebar-user{
  padding:12px 14px;border-top:1px solid var(--sidebar-border);
  display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.15);
}
.avatar{
  width:32px;height:32px;border-radius:6px;background:#334155;color:#f8fafc;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0;
}
.sidebar-user .nm{color:#f8fafc;font-size:12px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-user .rl{font-size:10.5px;color:#94a3b8}
.sidebar-user button{
  margin-left:auto;background:transparent;border:1px solid #334155;color:#94a3b8;
  border-radius:5px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
}
.sidebar-user button:hover{background:var(--red);border-color:var(--red);color:#fff}

.main{flex:1;margin-left:244px;display:flex;flex-direction:column;min-width:0}
#topbar{
  position:sticky;top:0;height:54px;background:var(--topbar-bg);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:12px;padding:0 24px;z-index:40;
}
#topbar h1{font-size:15.5px;font-weight:600;color:var(--text);letter-spacing:-.01em}
#hamburger{
  display:none;background:#fff;border:1px solid var(--border);
  border-radius:var(--radius);width:34px;height:34px;align-items:center;justify-content:center;color:#334155;
}
.bell-wrap{position:relative;margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  width:34px;height:34px;font-size:14px;color:#334155;
  display:flex;align-items:center;justify-content:center;position:relative;transition:.12s;
}
.icon-btn:hover{background:#f8fafc;border-color:#94a3b8;color:var(--text)}
.bell-badge{
  position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;
  border-radius:4px;min-width:17px;height:17px;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.user-chip{
  display:flex;align-items:center;gap:9px;background:#f8fafc;
  border:1px solid var(--border);border-radius:var(--radius);padding:4px 10px 4px 5px;
}
.user-chip .nm{font-size:12px;font-weight:600;line-height:1.15;color:var(--text)}
.user-chip .rl{font-size:10.5px;color:var(--muted)}
.notif-panel{
  position:absolute;right:0;top:42px;width:360px;max-width:90vw;
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 10px 25px rgba(15,23,42,.12);overflow:hidden;z-index:60;
}
.notif-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;background:#f8fafc;border-bottom:1px solid var(--border);
  font-weight:600;font-size:12.5px;
}
.notif-head button{background:none;border:none;color:var(--blue);font-size:11.5px;font-weight:600}
.notif-list{max-height:340px;overflow-y:auto}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border-light);font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.notif-item.unread{background:#f8fafc;font-weight:600}
.notif-item time{display:block;color:var(--muted);font-size:10.5px;margin-top:3px;font-weight:400}
#page-content{padding:22px 24px;max-width:1280px;width:100%;margin:0 auto}

/* ============================= CARTES & INDICATEURS KPI ============================= */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 20px;margin-bottom:16px;
}
.card h2{
  font-size:14px;font-weight:600;color:var(--text);
  margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em;
}
.card h2 .h-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-bottom:16px}
.stat{
  background:var(--card);border:1px solid var(--border);border-left:3px solid #334155;
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:13px 15px;display:flex;flex-direction: row-reverse;justify-content:space-between;align-items:flex-start;gap:10px;
}
.stat .ico{
  width:30px;height:30px;border-radius:5px;background:#f8fafc;border:1px solid var(--border-light);
  color:#475569;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;
}
.stat .ico svg{width:15px;height:15px}
.stat:has(.ico.blue){border-left-color:var(--blue)}
.stat:has(.ico.green){border-left-color:var(--green)}
.stat:has(.ico.amber){border-left-color:var(--amber)}
.stat:has(.ico.red){border-left-color:var(--red)}
.stat:has(.ico.purple){border-left-color:#6d28d9}
.stat:has(.ico.teal){border-left-color:var(--teal)}
.stat .v{font-size:20px;font-weight:700;color:var(--text);line-height:1.2;white-space:nowrap}
.stat .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.grid2{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;align-items:start}
.empty{text-align:center;color:var(--muted);padding:30px 12px;font-size:13px}

/* ============================= TABLEAUX ERP ============================= */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{
  background:#f8fafc;color:#475569;text-align:left;padding:9px 12px;
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border-light);vertical-align:middle;color:#1e293b}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f8fafc}
.tbl a{color:var(--blue);text-decoration:none;font-weight:500}
.tbl a:hover{text-decoration:underline}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cell-main{font-weight:600;color:var(--text)}
.cell-sub{font-size:11.5px;color:var(--muted)}

/* ============================= BADGES STATUTS SOBRES ============================= */
.badge{
  display:inline-flex;align-items:center;padding:2px 8px;
  border-radius:4px;font-size:10.5px;font-weight:600;letter-spacing:.03em;
  white-space:nowrap;border:1px solid transparent;
}
.b-gray{background:var(--gray-bg);color:var(--gray);border-color:var(--gray-border)}
.b-green{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.b-red{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.b-amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-border)}
.b-blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-border)}
.b-purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border)}
.b-teal{background:var(--teal-bg);color:var(--teal);border-color:var(--teal-border)}
.b-orange{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-border)}

/* ============================= BARRE DE PROGRESSION (6 ÉTAPES) ============================= */
.steps{display:flex;align-items:flex-start;margin:10px 0 4px}
.step{flex:1;text-align:center;position:relative;font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--muted);min-width:0}
.step::before{content:'';position:absolute;top:12px;left:-50%;width:100%;height:2px;background:var(--border)}
.step:first-child::before{display:none}
.step .dot{
  width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--border);
  margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;position:relative;z-index:1;color:transparent;
}
.step.done::before,.step.current::before{background:var(--primary)}
.step.done .dot{border-color:var(--primary);background:var(--primary);color:#fff}
.step.current .dot{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.step.current .lbl{color:var(--blue);font-weight:700}
.step.done .lbl{color:var(--text)}
.step.error::before{background:var(--red)}
.step.error .dot{border-color:var(--red);background:var(--red);color:#fff}
.step.error .lbl{color:var(--red)}

/* ============================= TIMELINE ============================= */
.timeline{list-style:none;position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:4px;top:6px;bottom:8px;width:1.5px;background:var(--border)}
.timeline li{position:relative;padding:0 0 12px 10px}
.timeline li::before{content:'';position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.timeline .tl-date{font-size:11px;color:var(--muted);font-weight:500}
.timeline .tl-ev{font-size:12.5px;font-weight:500;color:var(--text)}

/* ============================= ASSISTANT NOUVELLE DEMANDE ============================= */
.stepper{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.stepper .stp{
  flex:1;min-width:95px;background:#f8fafc;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;font-size:11.5px;font-weight:600;
  color:var(--muted);text-align:center;
}
.stepper .stp.active{border-color:var(--primary);color:#fff;background:var(--primary)}
.stepper .stp.ok{border-color:var(--green-border);color:var(--green);background:var(--green-bg)}
.wiz-foot{display:flex;gap:8px;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--border-light);flex-wrap:wrap}
.art-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table.art{border-collapse:collapse;width:100%;min-width:760px}
.art th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#475569;padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
.art td{padding:7px 8px;border-bottom:1px solid var(--border-light)}
.art input{width:100%;border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:12.5px;background:#fff}
.art input:focus{outline:none;border-color:#334155}
.art .art-total{font-weight:600;text-align:right;white-space:nowrap;font-size:12.5px}
.total-est{
  display:flex;justify-content:flex-end;align-items:center;gap:14px;
  margin-top:12px;padding:10px 14px;background:#f8fafc;border:1px solid var(--border-light);border-radius:var(--radius);flex-wrap:wrap;
}
.total-est .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.total-est b{font-size:18px;color:var(--text)}

/* ============================= SÉLECTION FOURNISSEURS ============================= */
#wiz-sup-list{
  max-height:440px;overflow-y:auto;padding:10px;
  border:1px solid var(--border);border-radius:var(--radius);background:#f8fafc;
  scrollbar-width:thin;scrollbar-color:#94a3b8 #e2e8f0;
}
#wiz-sup-list::-webkit-scrollbar{width:7px}
#wiz-sup-list::-webkit-scrollbar-track{background:#e2e8f0;border-radius:4px}
#wiz-sup-list::-webkit-scrollbar-thumb{background:#64748b;border-radius:4px}
.pick-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.pick-item{
  border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;
  background:#fff;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:.12s;
}
.pick-item:hover{border-color:#64748b}
.pick-item.sel{border-color:var(--primary);background:#f8fafc;box-shadow:inset 0 0 0 1px var(--primary)}
.pick-item.dis{opacity:.5;cursor:not-allowed}
.pick-item input{margin-top:3px;accent-color:var(--primary)}
.pick-item b{font-size:12.5px;display:block;color:var(--text)}
.pick-item .meta{font-size:11px;color:var(--muted)}

/* ============================= COMPARAISON ============================= */
.cmp-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table.cmp{border-collapse:collapse;min-width:560px;width:100%;font-size:12.5px}
.cmp th{background:#f8fafc;padding:9px 11px;border:1px solid var(--border);font-size:12px;text-align:center;min-width:150px}
.cmp th .who{font-weight:700;color:var(--text)}
.cmp td:first-child{font-weight:600;background:#f8fafc;font-size:12px;padding:8px 11px;border:1px solid var(--border);white-space:nowrap;text-align:left}
.cmp td{border:1px solid var(--border);padding:7px 9px;text-align:center}
.cmp input{width:115px;border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:12.5px;text-align:center;background:#fff}
.cmp input.wide{width:185px;text-align:left}
.cmp input:focus{outline:none;border-color:#334155}
.cmp .colchosen{background:#f8fafc}
.cmp td.cellbest{background:var(--green-bg);box-shadow:inset 0 0 0 1.5px var(--green-border)}
.chip{
  display:inline-block;background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);
  font-size:10px;font-weight:600;padding:1px 7px;border-radius:4px;margin:2px 1px 0;
}

/* ============================= CHOIX DU FOURNISSEUR ============================= */
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.choice-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:#fff}
.choice-card.chosen{border-color:var(--green);background:var(--green-bg)}
.choice-card h4{font-size:13.5px;margin-bottom:8px;font-weight:600}
.choice-card .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border-light)}
.choice-card .row span:last-child{font-weight:600;text-align:right}
.chosen-banner{
  background:#f8fafc;border:1px solid var(--border);border-left:3px solid var(--primary);
  color:var(--text);border-radius:var(--radius);padding:10px 14px;
  font-weight:600;margin:12px 0;display:flex;gap:9px;align-items:center;font-size:13px;
}

/* ============================= BARRE D'OUTILS / FILTRES ============================= */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{border:1px solid var(--border);border-radius:var(--radius);padding:7px 11px;font-size:12.5px;background:#fff}
.toolbar .search{flex:1;min-width:180px}

/* ============================= MODALES & TOASTS ============================= */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:flex;align-items:center;justify-content:center;padding:18px}
.modal-overlay{position:absolute;inset:0;background:rgba(15,23,42,.50)}
.modal{
  position:relative;background:#fff;border:1px solid var(--border);border-radius:8px;
  max-width:620px;width:100%;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 20px 45px rgba(15,23,42,.25);
}
.modal.wide{max-width:880px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:#f8fafc;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:14px;font-weight:600}
.modal-close{background:none;border:none;font-size:18px;color:var(--muted);line-height:1}
.modal-body{padding:16px 18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:11px 18px;background:#f8fafc;border-top:1px solid var(--border);flex-wrap:wrap}
#toast-root{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{
  background:#0f172a;color:#fff;padding:10px 15px;border-radius:var(--radius);
  font-size:12.5px;font-weight:500;box-shadow:0 8px 20px rgba(15,23,42,.25);
  display:flex;gap:8px;align-items:center;max-width:380px;
}
.toast.ok{background:#15803d}
.toast.err{background:#b91c1c}
.toast.warn{background:#b45309}

/* ============================= DIVERS ============================= */
.flow-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow-chip{background:#f8fafc;color:#334155;border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11.5px;font-weight:500}
.flow-arrow{color:#94a3b8;font-weight:600}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.bar-lab{width:135px;font-weight:600;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:#e2e8f0;border-radius:4px;height:10px;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);border-radius:4px}
.bar-val{width:115px;font-weight:600;flex-shrink:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:12.5px}
.kv span:first-child{color:var(--muted);font-weight:500}
.kv span:last-child{font-weight:600;text-align:right;color:var(--text)}
.actions-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

/* ============================= IMPRESSION ============================= */
#print-root{display:none}
#print-root img.print-logo{height:52px;width:auto;display:block;margin:0 auto 10px}
@page{size:A4 portrait;margin:0}
@media print{
  #app,#login-screen,#toast-root,#modal-root,#sidebar,#topbar{display:none!important}
  #print-root{display:block;font-size:13px;padding:14mm 12mm}
  body{background:#fff}
  a,a[href]{color:#000!important;text-decoration:none!important}
  a[href]::after,a[href]::before{content:none!important}
}

/* ============================= RESPONSIVE ============================= */
@media(max-width:980px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:none}
  .main{margin-left:0}
  #hamburger{display:flex}
  #page-content{padding:14px}
  .grid2{grid-template-columns:1fr}
  .user-chip .nm,.user-chip .rl{display:none}
  .user-chip{padding:4px}
}
@media(max-width:560px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .step .lbl{font-size:8px}
  #topbar h1{font-size:14px}
}

/* ============================= COMPARAISON DES PRIX — ÉTAPE 3 ============================= */
.nego-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px}
.nego-tools{display:flex;flex-wrap:wrap;gap:6px}
.nego-count{min-width:220px;flex:1;max-width:320px}
.nc-line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:5px}
.nego-progress{background:var(--border);border-radius:4px;height:7px;overflow:hidden}
.nego-progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .2s}
.cmp th .th-sub{font-size:10.5px;font-weight:500;color:var(--muted);margin-top:2px}
.cmp .nego-cell{min-width:150px;padding:7px 9px;text-align:center;vertical-align:top}
.cmp td.cell-total{background:#f8fafc}
.rank{display:inline-block;background:#f1f5f9;color:#1e293b;border:1px solid var(--border);border-radius:4px;padding:1px 7px;font-size:10px;font-weight:600;margin-top:3px;white-space:nowrap}
.chip-score{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border)}
.score-bar{background:var(--border);border-radius:4px;height:6px;overflow:hidden;margin:4px auto 3px;width:90px}
.score-fill{height:100%;border-radius:4px;transition:width .2s}
.btn-row{margin-top:4px;padding:2px 7px;font-size:11px}
.poids-box{border:1px solid var(--border);border-radius:var(--radius);background:#f8fafc;padding:9px 12px;margin-bottom:12px}
.poids-box summary{cursor:pointer;font-size:12px;font-weight:600;color:#334155}
.poids-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0 6px}
.poids-item{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#334155}
.poids-item input{width:72px;border:1px solid var(--border);border-radius:5px;padding:4px 7px;text-align:center;font-size:12px;background:#fff}
.poids-item input:focus{outline:none;border-color:#334155}
.chosen-banner .btn{margin-left:auto;flex-shrink:0}

/* ============================= ALERTES & RELANCES ============================= */
.alertes-bandeau{border:1px solid var(--amber-border);border-left:3px solid var(--amber);background:var(--amber-bg);border-radius:var(--radius);padding:11px 14px;margin-bottom:14px}
.alertes-bandeau.urgent{border-color:var(--red-border);border-left-color:var(--red);background:var(--red-bg)}
.ab-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:#9a3412;margin-bottom:6px}
.alertes-bandeau.urgent .ab-head{color:#991b1b}
.ab-seuils{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.ab-list{list-style:none;padding:0}
.ab-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(0,0,0,.06);font-size:12px}
.ab-item:first-child{border-top:none}
.ab-txt{flex:1}
.ab-item.urgent .ab-txt{font-weight:600;color:#991b1b}
.ab-item.alerte .ab-txt{font-weight:600;color:#9a3412}
.notif-item[data-act]{cursor:pointer;transition:.12s}
.notif-item[data-act]:hover{background:#f1f5f9}
.notif-item.urgent{background:var(--red-bg)}
.notif-item.alerte{background:var(--amber-bg)}
.notif-item.urgent.unread{border-left:3px solid var(--red)}
.notif-item.alerte.unread{border-left:3px solid #f59e0b}
.notif-head .badge{margin-left:6px}

@keyframes pulse-son{
  0%{box-shadow:0 0 0 0 rgba(185,28,28,.45)}
  70%{box-shadow:0 0 0 8px rgba(185,28,28,0)}
  100%{box-shadow:0 0 0 0 rgba(185,28,28,0)}
}
.icon-btn.alarme{border-color:var(--red)!important;color:var(--red)!important;animation:pulse-son 1.2s infinite}
.bell-badge.alarme{animation:pulse-son 1.2s infinite}

/* ============================= GRAPHIQUES ============================= */
.graph{position:relative}
.graph svg{width:100%;height:calc(100% - 20px);display:block;overflow:visible}
.graph svg rect{transition:opacity .12s}
.graph svg rect:hover{opacity:.82}
.graph-labels{display:flex;margin-top:4px}
.graph-labels span{flex:1;text-align:center;font-size:10px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.anneau-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.anneau{width:128px;height:128px;flex-shrink:0}
.anneau circle{transition:opacity .12s}
.anneau circle:hover{opacity:.85}
.anneau-total{font-size:18px;font-weight:700;fill:#0f172a}
.anneau-legende{font-size:8px;fill:#64748b;font-weight:600}
.legende{list-style:none;flex:1;min-width:170px;margin:0}
.legende li{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.legende i{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.legende span{flex:1;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legende b{font-weight:600}


/* ============================= DÉFILEMENT LISTES FOURNISSEURS (ÉTAPE 2 + CATALOGUE) ============================= */
#wiz-sup-list,
.pick-list{
  max-height:340px !important;
  overflow-y:auto !important;
  overflow-x:hidden;
  padding:10px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:#f8fafc;
  scrollbar-width:thin;
  scrollbar-color:#475569 #e2e8f0;
}
#wiz-sup-list .pick-list{
  max-height:none !important;
  overflow:visible !important;
  padding:0;
  border:none;
  background:transparent;
}
#sup-tablewrap .table-wrap{
  max-height:480px !important;
  overflow-y:auto !important;
  scrollbar-width:thin;
  scrollbar-color:#475569 #e2e8f0;
}
#sup-tablewrap .tbl th{
  position:sticky;
  top:0;
  z-index:5;
  background:#f1f5f9;
  box-shadow:0 1px 0 var(--border);
}
#wiz-sup-list::-webkit-scrollbar,
.pick-list::-webkit-scrollbar,
#sup-tablewrap .table-wrap::-webkit-scrollbar{width:9px;height:9px}
#wiz-sup-list::-webkit-scrollbar-track,
.pick-list::-webkit-scrollbar-track,
#sup-tablewrap .table-wrap::-webkit-scrollbar-track{background:#e2e8f0;border-radius:4px}
#wiz-sup-list::-webkit-scrollbar-thumb,
.pick-list::-webkit-scrollbar-thumb,
#sup-tablewrap .table-wrap::-webkit-scrollbar-thumb{background:#475569;border-radius:4px}
#wiz-sup-list::-webkit-scrollbar-thumb:hover,
.pick-list::-webkit-scrollbar-thumb:hover,
#sup-tablewrap .table-wrap::-webkit-scrollbar-thumb:hover{background:#1e293b}

<script>
/* ================================================================
   VOOMNET TECHNOLOGY — GESTION DES ACHATS (démo front-end)
   Application autonome générée depuis les sources Next.js
   (app/globals.css + scripts/shell.html + lib/voomnet.js).
   ================================================================ */

/* ---------- Supabase (optionnel) ----------
   Renseignez vos clés ci-dessous (Projet Supabase → Settings → API) pour
   synchroniser les données entre plusieurs postes. Laisser vide = mode local. */
window.VOOMNET_SUPABASE = { url: "", key: "" };

/* Couche de synchronisation Supabase (lib/supabaseSync.js) */
/* ================================================================
   VOOMNET TECHNOLOGY — Couche de synchronisation Supabase
   ----------------------------------------------------------------
   Rôle : garder l'objet DB (déjà utilisé par tous les écrans) en
   miroir d'une base Supabase, SANS modifier la logique métier.

   Principe :
     • l'application continue de travailler sur l'objet DB en mémoire ;
     • saveDB() déclenche une synchro DIFFÉRÉE (400 ms) qui n'envoie
       que les lignes ajoutées / modifiées / supprimées ;
     • au démarrage, on charge depuis Supabase (après l'affichage du
       cache local, pour rester instantané) ;
     • le temps réel (postgres_changes) rafraîchit les autres postes.

   Ce fichier est partagé : importé par Next.js et inliné tel quel
   dans la version autonome index.html (le générateur retire « export »).
   ================================================================ */

const VN_TABLES = ['users', 'suppliers', 'requests', 'orders', 'receptions', 'notifications', 'meta'];

/* Les colonnes delai_alerte / delai_urgence sont optionnelles : elles n'existent
   que si le script SQL correspondant a été exécuté. Positionné automatiquement
   à la première lecture de la table meta. */
let metaColonnesDelais = false;

/* ---------- Objets métier  <->  lignes SQL ---------- */
const VN_MAP = {
  users: {
    to: u => ({ id: u.id, nom: u.nom, identifiant: u.identifiant, email: u.email || '', tel: u.tel || '', service: u.service || '', fonction: u.fonction || '', password: u.password || '', role: u.role, statut: u.statut }),
    from: r => ({ id: r.id, nom: r.nom, identifiant: r.identifiant, email: r.email, tel: r.tel, service: r.service, fonction: r.fonction, password: r.password, role: r.role, statut: r.statut })
  },
  suppliers: {
    to: s => ({ id: s.id, nom: s.nom, references: s.references || '', emplacement: s.emplacement || '', whatsapp: s.whatsapp || '', site: s.site || '', statut: s.statut }),
    from: r => ({ id: r.id, nom: r.nom, references: r.references, emplacement: r.emplacement, whatsapp: r.whatsapp, site: r.site, statut: r.statut })
  },
  requests: {
    to: r => ({ id: r.id, numero: r.numero, date: r.date, demandeur_id: r.demandeurId, service: r.service || '', priorite: r.priorite, motif: r.motif || '', articles: r.articles || [], supplier_ids: r.supplierIds || [], offers: r.offers || {}, chosen_supplier_id: r.chosenSupplierId || null, justification: r.justification || '', statut: r.statut, submitted_at: r.submittedAt || null, step: r.step || null, validation: r.validation || null, history: r.history || [] }),
    from: r => ({ id: r.id, numero: r.numero, date: r.date, demandeurId: r.demandeur_id, service: r.service, priorite: r.priorite, motif: r.motif, articles: r.articles || [], supplierIds: r.supplier_ids || [], offers: r.offers || {}, chosenSupplierId: r.chosen_supplier_id || null, justification: r.justification, statut: r.statut, submittedAt: r.submitted_at || null, step: r.step || null, validation: r.validation || null, history: r.history || [] })
  },
  orders: {
    to: o => ({ id: o.id, numero: o.numero, request_id: o.requestId, supplier_id: o.supplierId, date: o.date, total: +o.total || 0, delai: o.delai || '', statut: o.statut, lignes: o.lignes || [] }),
    from: r => ({ id: r.id, numero: r.numero, requestId: r.request_id, supplierId: r.supplier_id, date: r.date, total: +r.total || 0, delai: r.delai, statut: r.statut, lignes: r.lignes || [] })
  },
  receptions: {
    to: x => ({ id: x.id, order_id: x.orderId, date: x.date || null, observations: x.observations || '', statut: x.statut, lignes: x.lignes || [] }),
    from: r => ({ id: r.id, orderId: r.order_id, date: r.date || null, observations: r.observations, statut: r.statut, lignes: r.lignes || [] })
  },
  notifications: {
    to: n => ({ id: n.id, user_id: n.userId, texte: n.texte, date: n.date, lu: !!n.lu }),
    from: r => ({ id: r.id, userId: r.user_id, texte: r.texte, date: r.date, lu: !!r.lu })
  },
  meta: {
    /* Les colonnes delai_alerte / delai_urgence sont optionnelles : elles n'existent
       que si l'administrateur a exécuté le script SQL correspondant. La synchro les
       utilise dès qu'elles sont présentes, et les ignore sinon (aucune erreur). */
    to: m => {
      /* Les seuils de relance voyagent dans la colonne JSONB « poids »
         (clés _alerte / _urgence) : ils sont donc synchronisés entre tous les
         postes SANS avoir à créer de colonne supplémentaire dans Supabase. */
      const poids = {};
      Object.keys(m.poids || {}).forEach(k => {
        if (k !== '_alerte' && k !== '_urgence' && k !== '_emails') poids[k] = (m.poids || {})[k];
      });
      poids._alerte  = m.delaiAlerte  === undefined ? 3 : Math.max(0, +m.delaiAlerte || 0);
      poids._urgence = m.delaiUrgence === undefined ? 7 : Math.max(1, +m.delaiUrgence || 7);
      if (m.emailsCopie) poids._emails = String(m.emailsCopie).trim();
      const o = { id: 'app', ach_counter: +m.achCounter || 0, bc_counter: +m.bcCounter || 0,
                  seuil_offres: +m.seuilOffres || 0, tva: +m.tva || 0, poids };
      /* si les colonnes dédiées existent (script SQL exécuté), on les alimente aussi */
      if (metaColonnesDelais){
        o.delai_alerte  = poids._alerte;
        o.delai_urgence = poids._urgence;
      }
      return o;
    },
    from: r => {
      metaColonnesDelais = Object.prototype.hasOwnProperty.call(r, 'delai_alerte');
      const brut = r.poids || {};
      const poids = {};
      Object.keys(brut).forEach(k => {
        if (k !== '_alerte' && k !== '_urgence' && k !== '_emails') poids[k] = brut[k];
      });
      const outMeta = {
        achCounter: +r.ach_counter || 0, bcCounter: +r.bc_counter || 0,
        seuilOffres: r.seuil_offres === undefined || r.seuil_offres === null ? 0 : +r.seuil_offres,
        tva: +r.tva || 0, poids,
        delaiAlerte: (metaColonnesDelais && r.delai_alerte !== undefined && r.delai_alerte !== null)
          ? +r.delai_alerte : (brut._alerte !== undefined && brut._alerte !== null ? +brut._alerte : 3),
        delaiUrgence: (metaColonnesDelais && r.delai_urgence !== undefined && r.delai_urgence !== null)
          ? +r.delai_urgence : (brut._urgence !== undefined && brut._urgence !== null ? +brut._urgence : 7)
      };
      if (brut._emails) outMeta.emailsCopie = String(brut._emails);
      return outMeta;
    }
  }
};

function createSupabaseSync(createClient, url, key) {
  const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });
  const snapshot = {};                 // table -> Map(id -> JSON de la ligne)
  const explicitDeletes = {};          // table -> Set(id explicitement supprimés sur ce poste)
  VN_TABLES.forEach(t => { explicitDeletes[t] = new Set(); });
  let timer = null, busy = false, selfUntil = 0;
  let lastError = null, lastSyncAt = null;

  function markDeleted(table, ids) {
    if (!explicitDeletes[table]) explicitDeletes[table] = new Set();
    (Array.isArray(ids) ? ids : [ids]).forEach(id => {
      if (id) explicitDeletes[table].add(id);
    });
  }

  const rowsOf = (db, t) => (t === 'meta' ? [VN_MAP.meta.to((db && db.meta) || {})] : ((db && db[t]) || []).map(VN_MAP[t].to));
  const snapOf = rows => new Map(rows.map(r => [r.id, JSON.stringify(r)]));

  /* ---------- Lecture ---------- */
  async function fetchAll() {
    const out = {};
    for (const t of VN_TABLES) {
      const { data, error } = await client.from(t).select('*');
      if (error) { lastError = error.message; throw new Error(t + ' : ' + error.message); }
      if (t === 'meta') { out.meta = data && data.length ? VN_MAP.meta.from(data[0]) : null; }
      else out[t] = (data || []).map(VN_MAP[t].from);
    }
    /* base vide : on ne renvoie rien, l'app poussera son jeu de démo au 1er saveDB() */
    if (!out.users || !out.users.length) return null;
    if (!out.meta) out.meta = null;
    VN_TABLES.forEach(t => { snapshot[t] = snapOf(rowsOf(out, t)); });
    return out;
  }

  /* ---------- Écriture (différentielle) ---------- */
  async function push(db) {
    if (busy) { timer = setTimeout(() => push(db), 500); return; }
    busy = true; selfUntil = Date.now() + 1500;
    try {
      for (const t of VN_TABLES) {
        const rows = rowsOf(db, t);
        const next = snapOf(rows);
        const prev = snapshot[t] || new Map();
        if (t === 'meta') {
          const changed = !prev.size || prev.get('app') !== next.get('app');
          if (changed) {
            const { error } = await client.from('meta').upsert(rows);
            if (error) throw new Error('meta : ' + error.message);
          }
          snapshot[t] = next; continue;
        }
        const upserts = rows.filter(r => prev.get(r.id) !== next.get(r.id));
        /* SÉCURITÉ MULTI-POSTES : on ne supprime dans Supabase QUE les lignes
           explicitement supprimées par l'utilisateur (via markDeleted), jamais
           les lignes simplement absentes d'un onglet non rafraîchi ! */
        const delSet = explicitDeletes[t] || new Set();
        const deletes = [...delSet].filter(id => !next.has(id));
        if (upserts.length) {
          const { error } = await client.from(t).upsert(upserts);
          if (error) throw new Error(t + ' : ' + error.message);
        }
        if (deletes.length) {
          const { error } = await client.from(t).delete().in('id', deletes);
          if (error) throw new Error(t + ' (suppression) : ' + error.message);
          deletes.forEach(id => delSet.delete(id));
        }
        snapshot[t] = next;
      }
      lastError = null; lastSyncAt = Date.now();
      return true;
    } catch (e) {
      lastError = e.message;
      return false;
    } finally {
      busy = false;
    }
  }
  /* Synchro différée : plusieurs saveDB() rapprochés = un seul aller-retour.
     « getDB » est une fonction : on pousse toujours l'état COURANT de
     l'application (jamais un instantané périmé capturé avant hydratation). */
  function sync(getDB) {
    clearTimeout(timer);
    timer = setTimeout(() => { push(typeof getDB === 'function' ? getDB() : getDB); }, 400);
  }
  /* Annule un envoi en attente (appelé juste après l'hydratation distante) */
  function cancelPending() { clearTimeout(timer); }

  /* ---------- Réinitialisation : on remplace tout le distant ---------- */
  async function reset(db) {
    busy = true; selfUntil = Date.now() + 3000;
    try {
      for (const t of ['notifications', 'receptions', 'orders', 'requests', 'suppliers', 'users', 'meta']) {
        const { error } = await client.from(t).delete().neq('id', '__rien__');
        if (error) throw new Error(t + ' : ' + error.message);
      }
      for (const t of VN_TABLES) {
        const rows = rowsOf(db, t);
        if (rows.length) {
          const { error } = await client.from(t).insert(rows);
          if (error) throw new Error(t + ' : ' + error.message);
        }
        snapshot[t] = snapOf(rows);
      }
      return true;
    } catch (e) { lastError = e.message; return false; }
    finally { busy = false; }
  }

  /* ---------- Temps réel ---------- */
  function subscribe(onChange) {
    try {
      const ch = client.channel('voomnet-sync')
        .on('postgres_changes', { event: '*', schema: 'public' }, () => {
          if (Date.now() < selfUntil) return;      // on ignore nos propres écritures
          onChange();
        })
        .subscribe();
      return () => { try { client.removeChannel(ch); } catch (e) { /* ignoré */ } };
    } catch (e) { return () => {}; }
  }

  return {
    client,
    enabled: () => true,
    tables: VN_TABLES,
    fetchAll, sync, push, reset, subscribe, cancelPending, markDeleted,
    getError: () => lastError,
    isSelfWrite: () => Date.now() < selfUntil,
    /* état affiché dans ⚙️ Paramètres (utile pour vérifier un déploiement Vercel) */
    status: () => ({
      configured: true,
      project: (String(url).replace(/^https?:\/\//, "").split(".")[0]) || "",
      online: !lastError,
      error: lastError,
      lastSyncAt: lastSyncAt
    })
  };
}

                'viewOrders','createOrder','viewReceptions','recordReception'],
  /* Le responsable peut désormais créer et suivre SES propres demandes,
   en plus de valider celles des autres. */
responsable: ['viewDashboard','validateRequests','viewAllRequests',
              'createRequest','viewOwnRequests','viewSuppliers',
              'viewOrders','createOrder','viewReceptions','recordReception']
};
function hasPermission(p){ return !!(sessionUser && PERMS[sessionUser.role] && PERMS[sessionUser.role].includes(p)); }

function doLogin(id, pw){
  const u = DB.users.find(x => norm(x.identifiant) === norm(id) && x.password === pw);
  if (!u) { toast('Identifiant ou mot de passe incorrect.', 'err'); return; }
  if (u.statut !== 'Actif') { toast('Ce compte est désactivé. Contactez l\'administrateur.', 'err'); return; }
  sessionUser = u;
  storage.setItem(SESSION_KEY, u.id);
  showApp();
  toast('Bienvenue ' + u.nom + ' 👋', 'ok');
}
function doLogout(){
  nettoyerDraftVide();          /* NIVEAU 2 : pas de brouillon vide abandonné */
  sessionUser = null;
  storage.removeItem(SESSION_KEY);
  $('#sidebar').classList.remove('open');
  $('#notif-panel').classList.add('hidden');
  showLogin();
}
function showLogin(){
  $('#app').classList.add('hidden');
  $('#login-screen').classList.remove('hidden');
  $('#login-id').value = ''; $('#login-pw').value = '';
}
function showApp(){
  $('#login-screen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#su-avatar').textContent = initials(sessionUser.nom);
  $('#su-name').textContent = sessionUser.nom;
  $('#su-role').textContent = ROLE_LABELS[sessionUser.role];
  $('#tu-avatar').textContent = initials(sessionUser.nom);
  $('#tu-name').textContent = sessionUser.nom;
  $('#tu-role').textContent = ROLE_LABELS[sessionUser.role];
  debloquerAudio();          // le clic de connexion débloque l'audio du navigateur
  genererRappels();          // relances au moment de la connexion
  autoriserSons();           // les sons ne se déclenchent qu'après l'ouverture de session
  /* petit résumé sonore si des alertes sont en cours (uniquement pour l'utilisateur
     qui vient de se connecter : évite qu'une minuterie d'une session précédente
     joue un son pour quelqu'un d'autre) */
  const uidConnexion = sessionUser ? sessionUser.id : '';
  setTimeout(() => {
    if (!sonActif() || !sessionUser || sessionUser.id !== uidConnexion) return;
    const l = alertesActives().filter(a => {
      if (sessionUser.role === 'admin') return true;
      if (sessionUser.role === 'responsable') return a.cibles === 'responsable';
      return a.cibles === 'demandeur' && a.demandeurId === sessionUser.id;
    });
    if (l.some(a => a.niveau === 'urgent')) jouerSonNotif('urgent');
    else if (l.length) jouerSonNotif('alerte');
  }, 3000);
  go('dashboard');
}

/* Sortie de l'assistant : nettoyage si vide, confirmation si du contenu existe */
function quitterAssistant(page, params, action){
  const dansWizard = state.page === 'nouvelleDemande';
  if (dansWizard && draft && page !== 'nouvelleDemande'){
    if (!(draft.articles || []).length){
      nettoyerDraftVide();                       /* NIVEAU 2 : rien à conserver */
    } else {
      /* NIVEAU 3 : confirmation avant de quitter un brouillon qui a du contenu */
      confirmModal('Quitter la demande en cours ?<br><span class="text-muted small">Le brouillon reste enregistré — vous pourrez le reprendre depuis « Mes demandes ».</span>',
        () => { action(page, params); });
      return;
    }
  }
  if (dansWizard && draft && page === 'nouvelleDemande' && (draft.articles || []).length){
    confirmModal('Abandonner la demande en cours et en créer une nouvelle ?', () => { action(page, params); });
    return;
  }
  action(page, params);
}

function go(page, params = {}){
  quitterAssistant(page, params, (pg, pr) => goInterne(pg, pr));
}

function goInterne(page, params = {}){
  const p = PAGES[page];
  if (p && p.perm && !hasPermission(p.perm)) { toast('Accès refusé : vous n\'avez pas la permission d\'accéder à cet écran.', 'err'); return; }
  if (page === 'detailDemande') {
    const r = byId(DB.requests, params.id);
    if (!r) { toast('Demande introuvable.', 'err'); return; }
    const allowed = hasPermission('viewAllRequests') || hasPermission('validateRequests') || r.demandeurId === sessionUser.id;
    if (!allowed) { toast('Accès refusé à cette demande.', 'err'); return; }
  }
  if (page === 'nouvelleDemande' && !params.resume) draft = null; // nouvelle demande = repartir de zéro
  state.page = page;
  state.params = params;
  state.nav = params.nav || page;
  render();
}

function render(){
  /* application différée d'un jeu de données reçu de Supabase
     (jamais pendant la saisie d'un assistant ou l'ouverture d'une modale) */
  if (pendingRemote && state.page !== 'nouvelleDemande' && !$('#modal-root').classList.contains('open')){
    DB = pendingRemote; pendingRemote = null;
    storage.setItem(DB_KEY, JSON.stringify(DB));
  }
  $('#notif-panel').classList.add('hidden');
  majBoutonSon();
  buildSidebar();
  updateBell();
  const c = $('#page-content');
  switch (state.page) {
    case 'nouvelleDemande':        renderWizard(); break;
    case 'mesDemandes':
    case 'toutesDemandes':
    case 'aValider':               c.innerHTML = viewRequestsList(state.page); break;
    case 'historiqueValidations':  c.innerHTML = viewValidationHistory(); break;
    case 'detailDemande':          c.innerHTML = viewRequestDetail(state.params.id); break;
    case 'creationCommande':       c.innerHTML = viewCreateOrder(state.params.id); break;
    case 'fournisseurs':           c.innerHTML = viewSuppliers(); break;
    case 'utilisateurs':           c.innerHTML = viewUsers(); break;
    case 'commandes':              c.innerHTML = viewOrders(); break;
    case 'receptions':             c.innerHTML = viewReceptions(); break;
    case 'rapports':               c.innerHTML = viewReports(); break;
    case 'parametres':             c.innerHTML = viewSettings(); break;
    default:                       c.innerHTML = viewDashboard();
  }
  const titles = { detailDemande:'Détail de la demande', creationCommande:'Création de la commande' };
  $('#page-title').textContent = titles[state.page] || (PAGES[state.page] ? PAGES[state.page].label : 'Tableau de bord');
  window.scrollTo(0, 0);
}

/* Total d'une offre : somme des prix négociés par article × quantités
   (compatibilité : anciennes offres au champ « prix » unique) */
function calcOfferBrut(r, o){
  if (!o) return 0;
  if (o.prixArticles && Object.keys(o.prixArticles).length){
    return (r.articles || []).reduce((s, a, i) => s + (+(o.prixArticles[i] || 0)) * (+a.quantite || 0), 0);
  }
  return +o.prix || 0;
}

/* ================================================================
   AMÉLIORATIONS DE L'ÉTAPE 3 — COMPARAISON DES PRIX
   • offre complète + seuil paramétrable d'offres complètes
   • coût total rendu : remise (%) · TVA (%) · frais de livraison
   • score multicritère pondéré (prix / délai / garantie / paiement)
   • outils de saisie assistée + export de la comparaison
   ================================================================ */
const DEFAULT_POIDS = { prix: 50, delai: 20, garantie: 20, paiement: 10 };
const meta = () => (DB && DB.meta) ? DB.meta : {};
function poids(){
  const p = Object.assign({}, DEFAULT_POIDS, meta().poids || {});
  const s = ['prix','delai','garantie','paiement'].reduce((t, k) => t + (Math.max(0, +p[k] || 0)), 0);
  return s > 0 ? p : Object.assign({}, DEFAULT_POIDS);
}
function poidsTotal(){ const p = poids(); return ['prix','delai','garantie','paiement'].reduce((t,k) => t + (+p[k]||0), 0); }
function seuilOffres(){ const n = +meta().seuilOffres; return n >= 0 ? n : 3; }  /* 0 = prix facultatifs */
function tauxTVA(){ const n = +meta().tva; return n >= 0 ? n : 0; }

/* Une offre est « complète » quand chaque article a un prix négocié > 0 */
function offreComplete(r, o){
  if (!o) return false;
  const arts = r.articles || [];
  if (!arts.length) return false;
  return arts.every((a, i) => +(((o.prixArticles || {})[i])) > 0);
}
function offresCompletes(r){ return (r.supplierIds || []).filter(sid => offreComplete(r, (r.offers || {})[sid])); }
function prixSaisis(r){
  const sids = r.supplierIds || [], arts = r.articles || [];
  let nb = 0;
  sids.forEach(sid => arts.forEach((a, i) => { if (+(((r.offers || {})[sid] || {}).prixArticles || {})[i] > 0) nb++; }));
  return { nb, total: sids.length * arts.length };
}

/* Décomposition du coût : brut → remise → net HT → TVA → frais → coût total rendu */
function calcOfferBreakdown(r, o){
  const brut = calcOfferBrut(r, o);
  const remisePct = Math.max(0, Math.min(100, +(o && o.remise) || 0));
  const remise = Math.round(brut * remisePct / 100);
  const netHT = brut - remise;
  const tva = Math.round(netHT * tauxTVA() / 100);
  const fraisLivraison = Math.max(0, Math.round(+((o && o.fraisLivraison) || 0)));
  return { brut, remisePct, remise, netHT, tva, fraisLivraison, total: netHT + tva + fraisLivraison };
}
function calcOfferTotal(r, o){ return calcOfferBreakdown(r, o).total; }

/* Score multicritère — note sur 100 (pondération réglable dans Paramètres généraux) */
function paymentDays(txt){
  const t = String(txt || '').toLowerCase().trim();
  if (!t) return null;
  if (/comptant|immediat|immédiat|avance/.test(t)) return 0;
  const mj = t.match(/(\d+)\s*(jour|j)\b/); if (mj) return +mj[1];
  const mm = t.match(/(\d+)\s*mois/);       if (mm) return +mm[1] * 30;
  const mn = t.match(/(\d+)/);              if (mn) return +mn[1];
  return null;
}
function paymentScore(txt){
  const d = paymentDays(txt);
  if (d === null) return 50;                       // conditions non précisées : neutre
  return Math.max(0, Math.min(100, 30 + d));       // 0 j → 30 · 30 j → 60 · 60 j → 90 · 90 j → 100
}
function scoresOffres(r){
  const sids = offresCompletes(r);
  if (!sids.length) return {};
  const p = poids(), tot = Math.max(1, poidsTotal());
  const off = r.offers || {};
  const totals = {}, delais = {}, gars = {}, pai = {};
  sids.forEach(sid => {
    const o = off[sid] || {};
    totals[sid] = calcOfferTotal(r, o);
    delais[sid] = +o.delai || 0;
    gars[sid]   = +o.garantie || 0;
    pai[sid]    = paymentScore(o.paiement);
  });
  const minT = Math.min(...sids.map(s => totals[s]));
  const dPos = sids.map(s => delais[s]).filter(x => x > 0);
  const gPos = sids.map(s => gars[s]).filter(x => x > 0);
  const minD = dPos.length ? Math.min(...dPos) : 0;
  const maxG = gPos.length ? Math.max(...gPos) : 0;
  const out = {};
  sids.forEach(sid => {
    const sPrix = minT > 0 ? Math.max(0, Math.min(100, 100 * minT / totals[sid])) : 0;
    const sDel  = (delais[sid] > 0 && minD > 0) ? Math.max(0, Math.min(100, 100 * minD / delais[sid])) : 50;
    const sGar  = maxG > 0 ? Math.max(0, Math.min(100, 100 * gars[sid] / maxG)) : 50;
    const sPai  = pai[sid];
    const note  = (sPrix*(+p.prix||0) + sDel*(+p.delai||0) + sGar*(+p.garantie||0) + sPai*(+p.paiement||0)) / tot;
    out[sid] = { note: Math.round(note), prix: Math.round(sPrix), delai: Math.round(sDel), garantie: Math.round(sGar), paiement: Math.round(sPai), total: totals[sid] };
  });
  return out;
}
function meilleureOffre(r){
  const s = scoresOffres(r);
  const best = Object.entries(s).sort((a, b) => b[1].note - a[1].note || a[1].total - b[1].total)[0];
  return best ? Object.assign({ sid: best[0] }, best[1]) : null;
}
/* Classement des offres complètes par coût total rendu croissant */
function classementOffres(r){
  return offresCompletes(r)
    .map(sid => ({ sid, total: calcOfferTotal(r, (r.offers || {})[sid]) }))
    .sort((a, b) => a.total - b.total)
    .reduce((acc, x, i) => { acc[x.sid] = i + 1; return acc; }, {});
}
/* Meilleur prix négocié pour un article (offres complètes uniquement) */
function meilleurPrixArticle(r, i){
  const sids = offresCompletes(r);
  const vals = sids.map(sid => +(((((r.offers || {})[sid] || {}).prixArticles) || {})[i]) || 0).filter(v => v > 0);
  return vals.length ? Math.min(...vals) : null;
}
const fmtPct = n => (Math.round(+n || 0)) + ' %';
function ecartPctHTML(neg, pres){
  if (!pres || !neg) return '<span class="cell-sub">—</span>';
  const d = (pres - neg) / pres * 100;
  const ok = d >= 0;
  return `<span class="cell-sub" style="font-weight:800;color:${ok ? 'var(--green)' : 'var(--red)'}">${ok ? '−' : '+'} ${fmtPct(Math.abs(d))}</span>`;
}
function scoreBar(note){
  const n = Math.max(0, Math.min(100, +note || 0));
  const couleur = n >= 75 ? 'var(--green)' : n >= 50 ? 'var(--amber)' : 'var(--red)';
  return `<div class="score-bar"><div class="score-fill" style="width:${n}%;background:${couleur}"></div></div>`;
}
function rangBadge(n){ return `<span class="rank">#${n} — ${n === 1 ? 'Meilleur total' : ('Rang ' + n)}</span>`; }

function pushHist(r, ev, date){
  const ex = (r.history||[]).find(h => h.ev === ev);
  if (ex) ex.date = date || nowISO();
  else { r.history = r.history || []; r.history.push({date: date || nowISO(), ev}); }
}

/* Barre de progression en 6 étapes (où en est ma demande ?) */
function progressHTML(r){
  const order = DB.orders.find(o => o.requestId === r.id && o.statut === 'Confirmée');
  const recOk = order && DB.receptions.find(x => x.orderId === order.id && x.statut === 'Complète');
  const st = r.statut;
  const valDone = ['approuvee','commandee','reception_partielle','cloturee'].includes(st);
  const draftSt = (st === 'brouillon' || st === 'en_comparaison');
  const steps = [
    {l:'DEMANDE',    s:'done'},
    {l:'VALIDATION', s: st === 'refusee' ? 'error' : valDone ? 'done' : st === 'en_attente' ? 'current' : 'todo'},
    {l:'COMPARAISON',s: draftSt ? 'current' : 'done'},
    {l:'CHOIX',      s: r.chosenSupplierId ? 'done' : draftSt ? 'todo' : 'done'},
    {l:'COMMANDE',   s: order ? 'done' : st === 'approuvee' ? 'current' : 'todo'},
    {l:'RÉCEPTION',  s: recOk ? 'done' : (st === 'commandee' || st === 'reception_partielle') ? 'current' : 'todo'}
  ];
  return '<div class="steps">' + steps.map(x =>
    `<div class="step ${x.s}"><div class="dot">${x.s==='done'?'✓':x.s==='error'?'✕':''}</div><div class="lbl">${x.l}</div></div>`
  ).join('') + '</div>';
}

function timelineHTML(r){
  const items = clone(r.history || []).sort((a,b) => new Date(a.date) - new Date(b.date));
  if (!items.length) return '<div class="empty">Aucun événement.</div>';
  return '<ul class="timeline">' + items.map(h =>
    `<li><div class="tl-date">${fmtDT(h.date)}</div><div class="tl-ev">${esc(h.ev)}</div></li>`
  ).join('') + '</ul>';
}

/* Meilleures offres : 💰 meilleur total · 🚚 livraison la plus rapide · 🛡️ meilleure garantie */
function bestOffers(r){
  const sids = r.supplierIds || [];
  /* seules les offres COMPLÈTES (tous les articles chiffrés) concourent au meilleur total */
  const withTotal = offresCompletes(r);
  const withDelai = sids.filter(id => +(((r.offers || {})[id] || {}).delai) > 0);
  const withGar   = sids.filter(id => +(((r.offers || {})[id] || {}).garantie) > 0);
  const minT = withTotal.length ? Math.min(...withTotal.map(id => calcOfferTotal(r, r.offers[id]))) : null;
  const minD = withDelai.length ? Math.min(...withDelai.map(id => +r.offers[id].delai)) : null;
  const maxG = withGar.length   ? Math.max(...withGar.map(id => +r.offers[id].garantie)) : null;
  return {
    prix:  minT === null ? [] : withTotal.filter(id => calcOfferTotal(r, r.offers[id]) === minT),
    delai: minD === null ? [] : withDelai.filter(id => +r.offers[id].delai === minD),
    gar:   maxG === null ? [] : withGar.filter(id => +r.offers[id].garantie === maxG)
  };
}
function chipsFor(r, sid){
  const b = bestOffers(r); let h = '';
  if (b.prix.includes(sid))  h += '<span class="chip">Meilleur coût total</span>';
  if (b.delai.includes(sid)) h += '<span class="chip">Délai le plus court</span>';
  if (b.gar.includes(sid))   h += '<span class="chip">Meilleure garantie</span>';
  const best = meilleureOffre(r);
  if (best && best.sid === sid && Object.keys(scoresOffres(r)).length > 1)
    h += `<span class="chip chip-score">Meilleur score (${best.note}/100)</span>`;
  return h;
}

/* Ligne « × quantité = total » sous chaque prix saisi */
function lineTotalHTML(a, p){
  if (!p) return '<span class="cell-sub">— saisir le prix —</span>';
  return `<span class="cell-sub">× ${a.quantite} = <b>${fmtM(p * (+a.quantite || 0))}</b></span>`;
}
/* Cellules « coût » d'une offre : brut · remise · net HT · TVA · frais · total rendu */
function coutCellHTML(r, sid){
  const o = (r.offers || {})[sid] || {}, b = calcOfferBreakdown(r, o);
  return {
    brut:  `<td data-brutof="${sid}">${b.brut ? fmtM(b.brut) : '—'}</td>`,
    remise:`<td><input type="number" min="0" max="100" step="1" data-of="${sid}" data-f="remise" value="${b.remisePct || ''}" placeholder="0"><div class="cell-sub" data-remiseof="${sid}">${b.remise ? '− ' + fmtM(b.remise) : ''}</div></td>`,
    net:   `<td data-netof="${sid}">${b.netHT ? fmtM(b.netHT) : '—'}</td>`,
    tva:   `<td data-tvaof="${sid}">${b.tva ? fmtM(b.tva) : '—'}</td>`,
    frais: `<td><input type="number" min="0" step="1000" data-of="${sid}" data-f="fraisLivraison" value="${b.fraisLivraison || ''}" placeholder="0"></td>`,
    total: `<td class="cell-total" data-totalof="${sid}"><b>${b.total ? fmtM(b.total) : '—'}</b></td>`,
    ecart: (() => {
      const pres = totalEstimatif(r);
      if (!b.total || !pres) return `<td data-ecartof="${sid}">—</td>`;
      const d = pres - b.total, pct = Math.round(Math.abs(d) / pres * 100);
      return `<td data-ecartof="${sid}" style="font-weight:800;color:${d >= 0 ? 'var(--green)' : 'var(--red)'}">${d >= 0 ? '− ' : '+ '}${fmtM(Math.abs(d))}<div class="cell-sub">${fmtPct(pct)}</div></td>`;
    })()
  };
}

  const seuilEl = $('[data-nego-seuil]');
  if (seuilEl){
    const c = offresCompletes(r).length, s = seuilOffres();
    seuilEl.className = 'badge ' + (c >= s ? 'b-green' : 'b-amber');
    seuilEl.textContent = `${c} offre${c > 1 ? 's' : ''} complète${c > 1 ? 's' : ''} — minimum ${s}`;
  }

    const bl = $(`[data-badgelist="${sid}"]`); if (bl) bl.innerHTML = chipsFor(r, sid);
    const c = coutCellHTML(r, sid);
    /* remplacement des cellules de coût en conservant l'attribut de ciblage */

    };
    upd('data-brutof', c.brut);

    upd('data-netof', c.net); upd('data-tvaof', c.tva);

  });
  (r.articles || []).forEach((a, i) => {
    const bestP = meilleurPrixArticle(r, i);

  }
  /* Bannière « meilleure offre globale » */
  const best = meilleureOffre(r);
  const bb = $('[data-bestbanner]');

      const cls = chosen ? 'colchosen' : '';
      const p = +((o.prixArticles || {})[i]) || 0;
      if (editable){
        return `<td class="nego-cell ${cls}" data-cell="${sid}-${i}"><input type="number" min="0" step="500" data-of="${sid}" data-ai="${i}" value="${p || ''}" placeholder="Prix négocié">
          <div data-lt="${sid}-${i}">${lineTotalHTML(a, p)}</div><div data-ec="${sid}-${i}">${ecartPctHTML(p, +a.prix)}</div></td>`;
      }
      if (!p) return `<td class="${cls}"><span class="badge b-red">NON RENSEIGNÉ</span></td>`;
      const best = bestP !== null && p === bestP;
      return `<td class="${cls}${best ? ' cellbest' : ''}">${fmtM(p)}
        <div class="cell-sub">× ${a.quantite} = <b>${fmtM(p * (+a.quantite || 0))}</b></div>
        <div>${ecartPctHTML(p, +a.prix)}</div>
        ${best ? '<br><span class="chip">Meilleur prix</span>' : ''}</td>`;
    }).join('');
    rows.push(`<tr><td>📦 <b>${esc(a.designation)}</b><div class="cell-sub">Quantité : ${a.quantite} · coût présumé : ${fmtM(a.prix)}</div></td>${cells}</tr>`);
  });

  /* Synthèse financière + score multicritère */
  const cRO = {}, cED = {};
  sids.forEach(sid => { cRO[sid] = coutROCellHTML(r, sid); cED[sid] = coutCellHTML(r, sid); });
  const ligne = (label, sub, key) => `<tr><td>${label}${sub ? `<div class="cell-sub">${sub}</div>` : ''}</td>${sids.map(sid => (editable ? cED[sid][key] : cRO[sid][key])).join('')}</tr>`;
  rows.push(ligne('💰 <b>TOTAL ARTICLES (brut)</b>', 'prix négociés × quantités', 'brut'));
  rows.push(ligne('🏷️ <b>Remise commerciale</b>', '', 'remise'));
  rows.push(ligne('🧾 <b>NET HT</b>', 'après remise', 'net'));
  rows.push(ligne(`💵 <b>TVA (${fmtPct(tva)})</b>`, '', 'tva'));
  rows.push(ligne('🚛 <b>Frais de livraison</b>', '', 'frais'));
  rows.push(ligne('⭐ <b>COÛT TOTAL RENDU</b>', 'net HT + TVA + livraison', 'total'));
  rows.push(ligne('📈 <b>Écart vs somme présumée</b>', `Présumé : ${fmtM(pres)}`, 'ecart'));
  rows.push(`<tr><td>⭐ <b>SCORE GLOBAL (/100)</b><div class="cell-sub">prix · délai · garantie · paiement</div></td>${sids.map(sid => scoreCellHTML(r, sid)).join('')}</tr>`);

  const crit = (icon, label, f, fmt, type, extra) => `<tr><td>${icon} ${label}</td>${sids.map(sid => {
    const o = off[sid] || {};
    const chosen = sid === r.chosenSupplierId;
    const v = o[f];
    const show = (v === undefined || v === null || v === '') ? '' : ((f === 'delai' || f === 'garantie') && !+v) ? '' : v;
    if (editable && f) return `<td class="${chosen ? 'colchosen' : ''}"><input type="${type || 'text'}" ${extra || ''} data-of="${sid}" data-f="${f}" value="${esc(show)}"></td>`;
    return `<td class="${chosen ? 'colchosen' : ''}">${fmt(o)}</td>`;
  }).join('')}</tr>`;
  rows.push(crit('🚚', 'Délai de livraison', 'delai', o => fmtDel(o.delai), 'number', 'min="0"'));
  rows.push(crit('🛡️', 'Garantie', 'garantie', o => fmtGar(o.garantie), 'number', 'min="0" step="0.5"'));
  rows.push(crit('💳', 'Conditions de paiement', 'paiement', o => esc(o.paiement || '—'), 'text', 'class="wide" placeholder="ex : 30 jours"'));
  rows.push(crit('📝', 'Observations', 'observations', o => esc(o.observations || '—'), 'text', 'class="wide"'));

  const best = meilleureOffre(r);
  const banner = (!editable && best)
    ? `<div class="chosen-banner"><b>Meilleure offre globale : ${esc(suppName(best.sid))}</b> — score <b>${best.note}/100</b> pour un coût total rendu de <b>${fmtM(best.total)}</b>.</div>`
    : '';
  const note = editable
    ? `<p class="hint text-muted small" style="margin-top:8px">📞 Après avoir <b>appelé chaque fournisseur</b>, saisissez ici les <b>nouveaux prix négociés</b> article par article, ainsi que le délai, la garantie et les conditions obtenues. Les totaux, le coût rendu et les scores se mettent à jour automatiquement.</p>`
    : `<p class="hint text-muted small" style="margin-top:8px">💰 Surligné en vert : <b>meilleur prix négocié</b> pour chaque article. Le <b>coût total rendu</b> intègre la remise, la TVA (${fmtPct(tva)}) et les frais de livraison ; le <b>score</b> pondère le prix, le délai, la garantie et le paiement. Les fournisseurs sans réponse complète sont exclus du classement.</p>`;
  return ` ${banner}<div class="cmp-scroll"><table class="cmp"><tr><th>Article \ Fournisseur</th>${head}</tr>${rows.join('')}</table></div>${note}`;
}

/* ---------- Sons de notification (Web Audio API : aucun fichier à télécharger,
   fonctionne donc aussi dans la version autonome et hors-ligne) ---------- */
const SON_CLE = 'voomnet_son';
let audioCtx = null;
const sonActif = () => storage.getItem(SON_CLE) !== '0';          // actif par défaut
function setSonActif(on){ storage.setItem(SON_CLE, on ? '1' : '0'); }
const VOL_CLE = 'voomnet_volume';
const volumes = { faible: 0.6, moyen: 1, fort: 1.6 };
function volumeSon(){ const v = storage.getItem(VOL_CLE); return volumes[v] || 1.6; }   /* « fort » par défaut */
function setVolumeSon(v){ storage.setItem(VOL_CLE, volumes[v] ? v : 'fort'); }
let sonPret = false;                                              // évite les bips au démarrage
function autoriserSons(){ setTimeout(() => { sonPret = true; }, 2500); }

/* Les navigateurs bloquent l'audio tant qu'aucune interaction n'a eu lieu :
   on crée / réactive le contexte audio dès le premier clic ou appui sur une touche. */
function contexteAudio(){
  try {
    const Ctx = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state !== 'running' && audioCtx.resume){ try { audioCtx.resume(); } catch(e){} }
    return audioCtx;
  } catch(e){ return null; }
}
function debloquerAudio(){
  const ctx = contexteAudio();
  return !!ctx && ctx.state === 'running';
}
function installerDeblocageAudio(){
  const unlock = () => {
    debloquerAudio();
    document.removeEventListener('pointerdown', unlock, true);
    document.removeEventListener('keydown', unlock, true);
    document.removeEventListener('touchstart', unlock, true);
  };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
  document.addEventListener('touchstart', unlock, true);
}

/* ---------- NOTIFICATIONS DU NAVIGATEUR (bulles système) ----------
   Elles s'affichent même si l'onglet VOOMNET est en arrière-plan, là où
   l'alarme sonore ne peut rien (le navigateur suspend l'audio). */
const NOTIF_NAV_CLE = 'voomnet_notifnav';
function notifNavSouhaitee(){ return storage.getItem(NOTIF_NAV_CLE) === '1'; }
function notifNavDisponible(){
  return typeof window !== 'undefined' && typeof window.Notification !== 'undefined';
}
function notifNavEtat(){
  if (!notifNavDisponible()) return 'indisponible';
  const P = window.Notification.permission;
  if (P === 'granted') return notifNavSouhaitee() ? 'active' : 'autorisee';
  if (P === 'denied')  return 'refusee';
  return 'vierge';
}
const notifNavLabel = {
  active: 'activées 🔔', autorisee: 'autorisées mais désactivées',
  refusee: 'refusées par le navigateur', vierge: 'non activées',
  indisponible: 'non gérées par ce navigateur'
};
function activerNotifNav(){
  if (!notifNavDisponible()){ toast('Ce navigateur ne gère pas les notifications système.', 'warn'); return; }
  const demande = window.Notification.requestPermission();
  const suite = (p) => {
    if (p === 'granted'){
      storage.setItem(NOTIF_NAV_CLE, '1');
      notifierNavigateur('VOOMNET — notifications activées',
        'Vous serez prévenu même si l\'onglet est en arrière-plan.');
      toast('Notifications du navigateur activées 🔔', 'ok');
    } else {
      storage.setItem(NOTIF_NAV_CLE, '0');
      toast('Autorisation refusée — réactivez-la dans les réglages du navigateur (icône 🔒 à gauche de l\'adresse).', 'warn');
    }
    render();
  };
  if (demande && demande.then) demande.then(suite).catch(() => toast('Demande impossible', 'err'));
  else suite(window.Notification.permission);
}
function desactiverNotifNav(){
  storage.setItem(NOTIF_NAV_CLE, '0');
  toast('Notifications du navigateur désactivées', 'ok'); render();
}
function notifNavActivePour(niveau){
  if (!notifNavSouhaitee() || !notifNavDisponible()) return false;
  if (window.Notification.permission !== 'granted') return false;
  const cfg = alarmeCfg();
  if (cfg.niveaux === 'urgent') return niveau === 'urgent';
  if (cfg.niveaux === 'urgent_alerte') return niveau === 'urgent' || niveau === 'alerte';
  return true;
}
function notifierNavigateur(titre, corps, requestId){
  try {
    if (!notifNavDisponible() || window.Notification.permission !== 'granted') return;
    const n = new window.Notification(titre, { body: corps, icon: LOGO_URL(), tag: requestId || 'voomnet' });
    n.onclick = (e) => {
      try { window.focus(); } catch(err){ /* ignoré */ }
      if (requestId) go('detailDemande', { id: requestId, nav: 'mesDemandes' });
      n.close();
    };
  } catch(e){ /* ignoré */ }
}
const titreNotif = (nv) => 'VOOMNET — ' + (nv === 'urgent' ? '🔴 urgence' : nv === 'alerte' ? '🟠 alerte' : '🔵 information');

/* ---------- ALARME RÉPÉTÉE ----------
   Tant qu'il reste des notifications non lues éligibles, la mélodie est
   rejouée à intervalle régulier. Elle s'arrête dès que les messages sont
   lus, si l'utilisateur coupe les sons, ou après un nombre max de
   répétitions (pour ne pas sonner indéfiniment sur un poste inoccupé). */
const ALARME_CLE = 'voomnet_alarme';
function alarmeCfg(){
  let c = {};
  try { c = JSON.parse(storage.getItem(ALARME_CLE) || '{}') || {}; } catch(e){ c = {}; }
  return {
    actif:   c.actif !== false,
    delai:   Math.max(5, +c.delai || 15),
    max:     Math.max(1, +c.max || 10),
    niveaux: c.niveaux || 'tous'        // tous | urgent_alerte | urgent
  };
}
function setAlarmeCfg(c){ storage.setItem(ALARME_CLE, JSON.stringify(c)); }

function notifsAlarme(){
  if (!sessionUser) return [];
  const cfg = alarmeCfg();
  return (DB.notifications || []).filter(n => {
    if (n.userId !== sessionUser.id || n.lu) return false;
    const nv = n.niveau || 'info';
    if (cfg.niveaux === 'urgent') return nv === 'urgent';
    if (cfg.niveaux === 'urgent_alerte') return nv === 'urgent' || nv === 'alerte';
    return true;
  });
}
function niveauLePlusFort(liste){
  if (liste.some(n => n.niveau === 'urgent')) return 'urgent';
  if (liste.some(n => n.niveau === 'alerte')) return 'alerte';
  return 'info';
}

let alarmeRepetitions = 0, alarmeEnCours = false;
/* Alerte VISUELLE de secours : le titre de l'onglet clignote tant qu'il reste
   des alertes non lues (utile si le son est coupé ou inaudible sur le poste). */
const TITRE_NORMAL = 'VOOMNET — Gestion des Achats';
let titreTimer = null, titreAlterne = false;
function majAlerteVisuelle(nb){
  const badge = $('#bell-badge');
  if (badge) badge.classList.toggle('alarme', nb > 0);
  if (!nb){
    if (titreTimer){ clearInterval(titreTimer); titreTimer = null; }
    titreAlterne = false;
    try { document.title = TITRE_NORMAL; } catch(e){}
    return;
  }
  const peindre = () => {
    titreAlterne = !titreAlterne;
    try { document.title = titreAlterne ? `🔴 ${nb} ALERTE${nb > 1 ? 'S' : ''} — VOOMNET` : TITRE_NORMAL; } catch(e){}
  };
  peindre();
  if (!titreTimer) titreTimer = setInterval(peindre, 1200);
}
function jouerAcquittement(){
  sonPret = true;
  try { bipe(523, 0, .13, .26); bipe(784, .15, .24, .26); } catch(e){ /* ignoré */ }
}
function majEtatAlarme(enCours){
  alarmeEnCours = !!enCours;
  const b = $('#btn-son'); if (b) b.classList.toggle('alarme', alarmeEnCours);
}
function arreterAlarme(acquitter){
  alarmeRepetitions = 0;
  majEtatAlarme(false);
  majAlerteVisuelle(0);
  /* bip de confirmation : dès que des messages non lus viennent d'être acquittés,
     même si l'alarme s'était déjà tue d'elle-même (maximum atteint) */
  if (acquitter && sonActif()) jouerAcquittement();
}
function surveillerAlarme(){
  if (!sessionUser || !sonActif()){ arreterAlarme(false); return; }
  const cfg = alarmeCfg();
  if (!cfg.actif){ alarmeRepetitions = 0; majEtatAlarme(false); return; }
  const nonLues = notifsAlarme();
  majAlerteVisuelle(nonLues.length);
  if (!nonLues.length){ if (alarmeEnCours) arreterAlarme(true); else alarmeRepetitions = 0; return; }
  /* on n'insiste pas si l'onglet est en arrière-plan (les navigateurs
     suspendent de toute façon les minuteries et l'audio) */
  if (typeof document !== 'undefined' && document.visibilityState === 'hidden') return;
  if (alarmeRepetitions >= cfg.max){ majEtatAlarme(false); return; }   // assez insisté : on garde le badge visuel
  if (Date.now() - dernierSon >= cfg.delai * 1000){
    alarmeRepetitions++;
    jouerSonNotif(niveauLePlusFort(nonLues), true);
    majEtatAlarme(true);
  }
}
function demarrerSurveillanceAlarme(){ setInterval(surveillerAlarme, 4000); }
