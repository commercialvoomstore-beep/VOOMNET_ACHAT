<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOOMNET — Gestion des Achats</title>
<!-- SheetJS (lecture/écriture Excel .xlsx). Sans Internet, l'application reste 100 % fonctionnelle en CSV et JSON. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Supabase (optionnel) : décommentez ce bloc et renseignez vos clés pour synchroniser les données
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->
<style>
/* ============================= RESET & VARIABLES ============================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#500070;--primary-dark:#000060;
  --navy:#000060;--navy2:#2b0050;
  /* ==== THÈME « CLAIR CORPORATE » ====
     Sidebar blanche bordée, accents violets, ensemble très lumineux. */
  --sidebar-bg:#ffffff;--sidebar-fg:#334155;--sidebar-border:#e2e8f0;
  --topbar-bg:#ffffff;
  --bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;
  --green:#16a34a;--green-bg:#dcfce7;
  --red:#dc2626;--red-bg:#fee2e2;
  --amber:#b45309;--amber-bg:#fef3c7;
  --orange:#c2410c;--orange-bg:#ffedd5;
  --blue:#000060;--blue-bg:#e9e7f8;
  --purple:#6d28d9;--purple-bg:#ede9fe;
  --teal:#0f766e;--teal-bg:#ccfbf1;
  --gray:#475569;--gray-bg:#e2e8f0;
  --radius:12px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.07);
}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,'Roboto',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.45}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.text-muted{color:var(--muted)}
.small{font-size:12px}
.mt{margin-top:14px}

/* ============================= BOUTONS ============================= */
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.success{background:var(--green);color:#fff}
.btn.success:hover{filter:brightness(.93)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{filter:brightness(.93)}
.btn.warning{background:var(--amber);color:#fff}
.btn.warning:hover{filter:brightness(.93)}
.btn.outline{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn.outline:hover{border-color:var(--primary);color:var(--primary)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-mini{background:#f1f5f9;border:none;border-radius:8px;width:30px;height:30px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.icon-mini:hover{background:#e2e8f0}

/* ============================= ÉCRAN DE CONNEXION ============================= */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#f8fafc 0%,#f1e9fb 45%,#e9e7f8 100%)}
.login-card{background:#fff;border:1px solid #e9e7f8;border-radius:20px;box-shadow:0 20px 50px rgba(15,23,42,.10);max-width:430px;width:100%;padding:38px 34px;text-align:center}
.login-logo-img{width:190px;max-width:78%;height:auto;margin:0 auto 14px;display:block}
.login-logo{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#500070,#000060);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-weight:800;font-size:34px;box-shadow:0 10px 24px rgba(80,0,112,.40)}
.login-title{font-size:28px;font-weight:800;letter-spacing:1px}
.login-sub{color:var(--muted);font-weight:700;letter-spacing:2.5px;font-size:11.5px;margin-top:2px}
.login-card form{margin-top:22px;text-align:left}
.demo-box{margin-top:20px;text-align:left}
.demo-box p{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.demo-chip{display:flex;justify-content:space-between;align-items:center;width:100%;background:#f8fafc;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;margin-top:7px;font-size:12.5px;font-weight:600;transition:.15s}
.demo-chip:hover{border-color:var(--primary);background:#f5e9fb}
.demo-chip code{background:#eef2ff;padding:2px 7px;border-radius:6px;color:var(--primary-dark);font-size:11px}

/* ============================= CHAMPS DE FORMULAIRE ============================= */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:#475569}
.field input,.field select,.field textarea{border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13.5px;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(80,0,112,.16)}
.field textarea{resize:vertical;min-height:74px}
.field .hint{font-size:11px;color:var(--muted)}
.field input[readonly]{background:#f8fafc;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.form-full{grid-column:1/-1}

/* ============================= STRUCTURE APPLICATION ============================= */
#app{display:flex;min-height:100vh}
#sidebar{width:252px;background:var(--sidebar-bg);color:var(--sidebar-fg);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .25s}
.sidebar-logo{display:flex;flex-direction:column;gap:9px;align-items:flex-start;padding:16px;border-bottom:1px solid var(--sidebar-border)}
.sidebar-logo img{width:100%;max-width:190px;height:auto;display:block}
.sidebar-logo .mini{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#500070,#000060);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0}
.sidebar-logo b{color:var(--text);font-size:15px;letter-spacing:.6px;display:block;line-height:1.2}
.sidebar-logo span{font-size:10px;color:var(--muted);letter-spacing:1.8px}
#sidebar nav{flex:1;overflow-y:auto;padding:10px}
.nav-group{font-size:10px;letter-spacing:1.4px;color:#5d7396;font-weight:800;padding:10px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--sidebar-fg);padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.15s}
.nav-item:hover{background:#f5e9fb;color:var(--primary)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(80,0,112,.28)}
.nav-item .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;border-radius:99px;padding:1px 7px;font-weight:800}
.sidebar-user{padding:12px;border-top:1px solid var(--sidebar-border);display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7b2fb0,#500070);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.sidebar-user .nm{color:var(--text);font-size:12.5px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-user .rl{font-size:10.5px;color:var(--muted)}
.sidebar-user button{margin-left:auto;background:#f1f5f9;border:none;color:var(--muted);border-radius:8px;width:32px;height:32px;font-size:14px}
.sidebar-user button:hover{background:var(--red);color:#fff}
.main{flex:1;margin-left:252px;display:flex;flex-direction:column;min-width:0}
#topbar{position:sticky;top:0;background:var(--topbar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:13px;padding:11px 22px;z-index:40;box-shadow:0 1px 3px rgba(15,23,42,.04)}
#topbar h1{font-size:18px;font-weight:800}
#hamburger{display:none;background:#fff;border:1.5px solid var(--border);border-radius:10px;width:38px;height:38px;font-size:17px;align-items:center;justify-content:center}
.bell-wrap{position:relative;margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{background:#fff;border:1.5px solid var(--border);border-radius:10px;width:38px;height:38px;font-size:17px;display:flex;align-items:center;justify-content:center;position:relative}
.icon-btn:hover{border-color:var(--primary)}
.bell-badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.user-chip{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:4px 12px 4px 5px}
.user-chip .nm{font-size:12.5px;font-weight:700;line-height:1.15}
.user-chip .rl{font-size:10.5px;color:var(--muted)}
.notif-panel{position:absolute;right:0;top:46px;width:350px;max-width:88vw;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:60}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:800;font-size:13.5px}
.notif-head button{background:none;border:none;color:var(--primary);font-size:11.5px;font-weight:700}
.notif-list{max-height:340px;overflow-y:auto}
.notif-item{padding:11px 14px;border-bottom:1px solid #f1f5f9;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.notif-item.unread{background:#f5e9fb;font-weight:600}
.notif-item time{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;font-weight:500}
#page-content{padding:22px;max-width:1220px;width:100%;margin:0 auto}

/* ============================= CARTES & STATISTIQUES ============================= */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card h2{font-size:15.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .h-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;display:flex;gap:12px;align-items:center}
.stat .ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;background:#f5e9fb}
.ico.blue{background:var(--blue-bg)}.ico.green{background:var(--green-bg)}.ico.amber{background:var(--amber-bg)}
.ico.red{background:var(--red-bg)}.ico.purple{background:var(--purple-bg)}.ico.teal{background:var(--teal-bg)}.ico.gray{background:var(--gray-bg)}
.stat .v{font-size:20px;font-weight:800;line-height:1.15;white-space:nowrap}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;align-items:start}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:13.5px}

/* ============================= TABLEAUX ============================= */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th{background:#f8fafc;color:#475569;text-align:left;padding:11px 13px;font-size:11px;letter-spacing:.7px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 13px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#faf5ff}
.tbl a{color:var(--primary);text-decoration:none;font-weight:600}
td.num,th.num{text-align:right}
.cell-main{font-weight:700}
.cell-sub{font-size:11.5px;color:var(--muted)}

/* ============================= BADGES ============================= */
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.4px;white-space:nowrap}
.b-gray{background:var(--gray-bg);color:var(--gray)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-purple{background:var(--purple-bg);color:var(--purple)}
.b-teal{background:var(--teal-bg);color:var(--teal)}
.b-orange{background:var(--orange-bg);color:var(--orange)}

/* ============================= BARRE DE PROGRESSION (6 ÉTAPES) ============================= */
.steps{display:flex;align-items:flex-start;margin:10px 0 2px}
.step{flex:1;text-align:center;position:relative;font-size:9.5px;font-weight:800;letter-spacing:.4px;color:var(--muted);min-width:0}
.step::before{content:'';position:absolute;top:14px;left:-50%;width:100%;height:3px;background:var(--border);border-radius:99px}
.step:first-child::before{display:none}
.step .dot{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--border);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;position:relative;z-index:1;color:transparent}
.step.done::before,.step.current::before{background:var(--green)}
.step.done .dot{border-color:var(--green);background:var(--green);color:#fff}
.step.current .dot{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px rgba(80,0,112,.20)}
.step.current .lbl{color:var(--primary)}
.step.done .lbl{color:var(--text)}
.step.error::before{background:var(--red)}
.step.error .dot{border-color:var(--red);background:var(--red);color:#fff}
.step.error .lbl{color:var(--red)}

/* ============================= TIMELINE ============================= */
.timeline{list-style:none;position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:8px;width:2px;background:var(--border)}
.timeline li{position:relative;padding:0 0 15px 12px}
.timeline li::before{content:'';position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px #e9d5ff}
.timeline .tl-date{font-size:11px;color:var(--muted);font-weight:700}
.timeline .tl-ev{font-size:13px;font-weight:600}

/* ============================= ASSISTANT NOUVELLE DEMANDE ============================= */
.stepper{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.stepper .stp{flex:1;min-width:88px;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:9px 8px;font-size:11.5px;font-weight:800;color:var(--muted);text-align:center}
.stepper .stp.active{border-color:var(--primary);color:var(--primary);background:#f5e9fb}
.stepper .stp.ok{border-color:var(--green);color:var(--green);background:#faf5ff}
.wiz-foot{display:flex;gap:9px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.art-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table.art{border-collapse:collapse;width:100%;min-width:880px}
.art th{background:#f8fafc;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#475569;padding:9px 8px;border-bottom:1px solid var(--border)}
.art td{padding:7px 6px;border-bottom:1px solid #f1f5f9}
.art input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:7px 8px;font-size:12.5px;background:#fff}
.art input:focus{outline:none;border-color:var(--primary)}
.art .art-total{font-weight:800;text-align:right;white-space:nowrap;font-size:12.5px}
.total-est{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.total-est .lbl{font-size:11.5px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.total-est b{font-size:21px;color:var(--primary)}

/* ============================= SÉLECTION FOURNISSEURS ============================= */
#wiz-sup-list{max-height:460px;overflow-y:auto;padding:10px;border:1.5px solid var(--border);border-radius:12px;background:#f8fafc;scrollbar-width:thin;scrollbar-color:var(--primary) #e2e8f0}
#wiz-sup-list::-webkit-scrollbar{width:8px}
#wiz-sup-list::-webkit-scrollbar-track{background:#e2e8f0;border-radius:99px}
#wiz-sup-list::-webkit-scrollbar-thumb{background:var(--primary);border-radius:99px}
.pick-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pick-item{border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;background:#fff;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:.15s}
.pick-item:hover{border-color:var(--primary)}
.pick-item.sel{border-color:var(--primary);background:#f5e9fb}
.pick-item.dis{opacity:.5;cursor:not-allowed}
.pick-item input{margin-top:3px;accent-color:var(--primary)}
.pick-item b{font-size:13px;display:block}
.pick-item .meta{font-size:11px;color:var(--muted)}

/* ============================= COMPARAISON ============================= */
.cmp-scroll{overflow-x:auto}
table.cmp{border-collapse:collapse;min-width:560px;width:100%}
.cmp th{background:#f8fafc;padding:10px 12px;border:1px solid var(--border);font-size:12.5px;text-align:center;min-width:150px}
.cmp th .who{font-weight:800}
.cmp td:first-child{font-weight:800;background:#f8fafc;font-size:12px;padding:10px 12px;border:1px solid var(--border);white-space:nowrap}
.cmp td{border:1px solid var(--border);padding:8px 10px;text-align:center}
.cmp input{width:115px;border:1.5px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;text-align:center;background:#fff}
.cmp input.wide{width:190px;text-align:left}
.cmp input:focus{outline:none;border-color:var(--primary)}
.cmp .colchosen{background:#faf5ff}
.cmp td.cellbest{background:#faf5ff;box-shadow:inset 0 0 0 2px #86efac}
.chip{display:inline-block;background:var(--green-bg);color:var(--green);font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin:2px 1px 0}

/* ============================= CHOIX DU FOURNISSEUR ============================= */
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}
.choice-card{border:2px solid var(--border);border-radius:14px;padding:16px;background:#fff}
.choice-card.chosen{border-color:var(--green);background:#faf5ff}
.choice-card h4{font-size:14px;margin-bottom:8px}
.choice-card .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed #eef2f7}
.choice-card .row span:last-child{font-weight:700;text-align:right}
.chosen-banner{background:var(--green-bg);border:1.5px solid var(--green);color:#14532d;border-radius:12px;padding:12px 16px;font-weight:800;margin:14px 0;display:flex;gap:9px;align-items:center;font-size:14px}

/* ============================= BARRE D'OUTILS / FILTRES ============================= */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search],.toolbar select{border:1.5px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;background:#fff}
.toolbar .search{flex:1;min-width:180px}

/* ============================= MODALES & TOASTS ============================= */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:flex;align-items:center;justify-content:center;padding:18px}
.modal-overlay{position:absolute;inset:0;background:rgba(15,23,42,.55)}
.modal{position:relative;background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.3);animation:pop .18s ease}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15.5px}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);line-height:1}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:13px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
#toast-root{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:#0f172a;color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:slidein .25s;display:flex;gap:9px;align-items:center;max-width:400px}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
.toast.warn{background:var(--amber)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}

/* ============================= DIVERS ============================= */
.flow-chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.flow-chip{background:#f5e9fb;color:#3b0053;border-radius:99px;padding:5px 12px;font-size:11.5px;font-weight:700}
.flow-arrow{color:#94a3b8;font-weight:800}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.bar-lab{width:135px;font-weight:700;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:#eef2f7;border-radius:99px;height:14px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#500070,#8b3fb8);border-radius:99px}
.bar-val{width:115px;font-weight:800;flex-shrink:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #eef2f7;font-size:13px}
.kv span:first-child{color:var(--muted);font-weight:600}
.kv span:last-child{font-weight:700;text-align:right}
.actions-bar{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}

/* ============================= IMPRESSION ============================= */
#print-root{display:none}
#print-root img.print-logo{height:52px;width:auto;display:block;margin:0 auto 10px}
/* Marges de page à 0 : supprime l'en-tête et le pied de page ajoutés par le
   navigateur (adresse du site, date, numéros de page). */
@page{size:A4 portrait;margin:0}
@media print{
  #app,#login-screen,#toast-root,#modal-root,#sidebar,#topbar{display:none!important}
  #print-root{display:block;font-size:13px;padding:14mm 12mm}
  body{background:#fff}
  /* aucun lien ni URL imprimé */
  a,a[href]{color:#000!important;text-decoration:none!important}
  a[href]::after,a[href]::before{content:none!important}
}

/* ============================= RESPONSIVE ============================= */
@media(max-width:980px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:none}
  .main{margin-left:0}
  #hamburger{display:flex}
  #page-content{padding:14px}
  .grid2{grid-template-columns:1fr}
  .user-chip .nm,.user-chip .rl{display:none}
  .user-chip{padding:4px}
}
@media(max-width:560px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .step .lbl{font-size:8px}
  #topbar h1{font-size:15px}
}

/* ============================= COMPARAISON DES PRIX — ÉTAPE 3 ============================= */
.nego-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.nego-tools{display:flex;flex-wrap:wrap;gap:8px}
.nego-count{min-width:230px;flex:1;max-width:340px}
.nc-line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:6px}
.nego-progress{background:var(--border);border-radius:99px;height:9px;overflow:hidden}
.nego-progress-fill{height:100%;background:linear-gradient(90deg,#500070,#8b3fb8);border-radius:99px;transition:width .25s}
.cmp th .th-sub{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:3px}
.cmp .nego-cell{min-width:155px;padding:8px 10px;text-align:center;vertical-align:top}
.cmp td.cell-total{background:#f8fafc}
.rank{display:inline-block;background:#f5e9fb;color:#3b0053;border-radius:99px;padding:2px 9px;font-size:10.5px;font-weight:800;margin-top:3px;white-space:nowrap}
.chip-score{background:var(--purple-bg);color:var(--purple)}
.score-bar{background:var(--border);border-radius:99px;height:7px;overflow:hidden;margin:4px auto 3px;width:100px}
.score-fill{height:100%;border-radius:99px;transition:width .25s}
.btn-row{margin-top:5px;padding:3px 8px;font-size:11px}
.poids-box{border:1px solid var(--border);border-radius:11px;background:#f8fafc;padding:10px 13px;margin-bottom:12px}
.poids-box summary{cursor:pointer;font-size:12.5px;font-weight:800;color:#475569}
.poids-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:11px 0 6px}
.poids-item{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#475569}
.poids-item input{width:76px;border:1.5px solid var(--border);border-radius:8px;padding:5px 8px;text-align:center;font-size:12.5px;background:#fff}
.poids-item input:focus{outline:none;border-color:var(--primary)}
.chosen-banner .btn{margin-left:auto;flex-shrink:0}
@media(max-width:560px){.nego-count{max-width:100%}}

/* ============================= ALERTES & RELANCES ============================= */
.alertes-bandeau{border:1.5px solid #fdba74;background:#fff7ed;border-radius:12px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.alertes-bandeau.urgent{border-color:#fca5a5;background:#fef2f2}
.ab-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:#9a3412;margin-bottom:8px}
.alertes-bandeau.urgent .ab-head{color:#991b1b}
.ab-seuils{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.ab-list{list-style:none;padding:0}
.ab-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed rgba(0,0,0,.09);font-size:12.5px}
.ab-item:first-child{border-top:none}
.ab-txt{flex:1}
.ab-item.urgent .ab-txt{font-weight:800;color:#991b1b}
.ab-item.alerte .ab-txt{font-weight:700;color:#9a3412}
.notif-item[data-act]{cursor:pointer;transition:.15s}
.notif-item[data-act]:hover{filter:brightness(.97)}
.notif-item.urgent{background:#fef2f2}
.notif-item.alerte{background:#fff7ed}
.notif-item.urgent.unread{border-left:4px solid var(--red)}
.notif-item.alerte.unread{border-left:4px solid #f59e0b}
.notif-head .badge{margin-left:6px}

/* --- Alarme répétée : le bouton 🔊 pulse tant qu'une notification n'est pas lue --- */
@keyframes pulse-son{
  0%{box-shadow:0 0 0 0 rgba(220,38,38,.55);transform:scale(1)}
  70%{box-shadow:0 0 0 10px rgba(220,38,38,0);transform:scale(1.07)}
  100%{box-shadow:0 0 0 0 rgba(220,38,38,0);transform:scale(1)}
}
.icon-btn.alarme{border-color:var(--red)!important;color:var(--red)!important;animation:pulse-son 1.1s infinite}

/* --- Alerte visuelle : la pastille de la cloche pulse s'il reste des alertes non lues --- */
.bell-badge.alarme{animation:pulse-son 1.1s infinite}

/* ============================= GRAPHIQUES ============================= */
.graph{position:relative}
.graph svg{width:100%;height:calc(100% - 20px);display:block;overflow:visible}
.graph svg rect{transition:opacity .15s}
.graph svg rect:hover{opacity:.78}
.graph-labels{display:flex;margin-top:4px}
.graph-labels span{flex:1;text-align:center;font-size:10px;color:var(--muted);font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.anneau-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.anneau{width:132px;height:132px;flex-shrink:0}
.anneau circle{transition:opacity .15s}
.anneau circle:hover{opacity:.82}
.anneau-total{font-size:19px;font-weight:800;fill:#0f172a}
.anneau-legende{font-size:8px;fill:#64748b;font-weight:700}
.legende{list-style:none;flex:1;min-width:170px;margin:0}
.legende li{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.legende i{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.legende span{flex:1;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legende b{font-weight:800}
@media(max-width:560px){.anneou,.anneau{width:110px;height:110px}}

<script>
/* ================================================================
   VOOMNET TECHNOLOGY — GESTION DES ACHATS (démo front-end)
   Application autonome générée depuis les sources Next.js
   (app/globals.css + scripts/shell.html + lib/voomnet.js).
   ================================================================ */

/* ---------- Supabase (optionnel) ----------
   Renseignez vos clés ci-dessous (Projet Supabase → Settings → API) pour
   synchroniser les données entre plusieurs postes. Laisser vide = mode local. */
window.VOOMNET_SUPABASE = { url: "", key: "" };

/* Couche de synchronisation Supabase (lib/supabaseSync.js) */
/* ================================================================
   VOOMNET TECHNOLOGY — Couche de synchronisation Supabase
   ----------------------------------------------------------------
   Rôle : garder l'objet DB (déjà utilisé par tous les écrans) en
   miroir d'une base Supabase, SANS modifier la logique métier.

   Principe :
     • l'application continue de travailler sur l'objet DB en mémoire ;
     • saveDB() déclenche une synchro DIFFÉRÉE (400 ms) qui n'envoie
       que les lignes ajoutées / modifiées / supprimées ;
     • au démarrage, on charge depuis Supabase (après l'affichage du
       cache local, pour rester instantané) ;
     • le temps réel (postgres_changes) rafraîchit les autres postes.

   Ce fichier est partagé : importé par Next.js et inliné tel quel
   dans la version autonome index.html (le générateur retire « export »).
   ================================================================ */

const VN_TABLES = ['users', 'suppliers', 'requests', 'orders', 'receptions', 'notifications', 'meta'];

/* Les colonnes delai_alerte / delai_urgence sont optionnelles : elles n'existent
   que si le script SQL correspondant a été exécuté. Positionné automatiquement
   à la première lecture de la table meta. */
let metaColonnesDelais = false;

/* ---------- Objets métier  <->  lignes SQL ---------- */
const VN_MAP = {
  users: {
    to: u => ({ id: u.id, nom: u.nom, identifiant: u.identifiant, email: u.email || '', tel: u.tel || '', service: u.service || '', fonction: u.fonction || '', password: u.password || '', role: u.role, statut: u.statut }),
    from: r => ({ id: r.id, nom: r.nom, identifiant: r.identifiant, email: r.email, tel: r.tel, service: r.service, fonction: r.fonction, password: r.password, role: r.role, statut: r.statut })
  },
  suppliers: {
    to: s => ({ id: s.id, nom: s.nom, references: s.references || '', emplacement: s.emplacement || '', whatsapp: s.whatsapp || '', site: s.site || '', statut: s.statut }),
    from: r => ({ id: r.id, nom: r.nom, references: r.references, emplacement: r.emplacement, whatsapp: r.whatsapp, site: r.site, statut: r.statut })
  },
  requests: {
    to: r => ({ id: r.id, numero: r.numero, date: r.date, demandeur_id: r.demandeurId, service: r.service || '', priorite: r.priorite, motif: r.motif || '', articles: r.articles || [], supplier_ids: r.supplierIds || [], offers: r.offers || {}, chosen_supplier_id: r.chosenSupplierId || null, justification: r.justification || '', statut: r.statut, submitted_at: r.submittedAt || null, step: r.step || null, validation: r.validation || null, history: r.history || [] }),
    from: r => ({ id: r.id, numero: r.numero, date: r.date, demandeurId: r.demandeur_id, service: r.service, priorite: r.priorite, motif: r.motif, articles: r.articles || [], supplierIds: r.supplier_ids || [], offers: r.offers || {}, chosenSupplierId: r.chosen_supplier_id || null, justification: r.justification, statut: r.statut, submittedAt: r.submitted_at || null, step: r.step || null, validation: r.validation || null, history: r.history || [] })
  },
  orders: {
    to: o => ({ id: o.id, numero: o.numero, request_id: o.requestId, supplier_id: o.supplierId, date: o.date, total: +o.total || 0, delai: o.delai || '', statut: o.statut, lignes: o.lignes || [] }),
    from: r => ({ id: r.id, numero: r.numero, requestId: r.request_id, supplierId: r.supplier_id, date: r.date, total: +r.total || 0, delai: r.delai, statut: r.statut, lignes: r.lignes || [] })
  },
  receptions: {
    to: x => ({ id: x.id, order_id: x.orderId, date: x.date || null, observations: x.observations || '', statut: x.statut, lignes: x.lignes || [] }),
    from: r => ({ id: r.id, orderId: r.order_id, date: r.date || null, observations: r.observations, statut: r.statut, lignes: r.lignes || [] })
  },
  notifications: {
    to: n => ({ id: n.id, user_id: n.userId, texte: n.texte, date: n.date, lu: !!n.lu }),
    from: r => ({ id: r.id, userId: r.user_id, texte: r.texte, date: r.date, lu: !!r.lu })
  },
  meta: {
    /* Les colonnes delai_alerte / delai_urgence sont optionnelles : elles n'existent
       que si l'administrateur a exécuté le script SQL correspondant. La synchro les
       utilise dès qu'elles sont présentes, et les ignore sinon (aucune erreur). */
    to: m => {
      /* Les seuils de relance voyagent dans la colonne JSONB « poids »
         (clés _alerte / _urgence) : ils sont donc synchronisés entre tous les
         postes SANS avoir à créer de colonne supplémentaire dans Supabase. */
      const poids = {};
      Object.keys(m.poids || {}).forEach(k => {
        if (k !== '_alerte' && k !== '_urgence') poids[k] = (m.poids || {})[k];
      });
      poids._alerte  = m.delaiAlerte  === undefined ? 3 : Math.max(0, +m.delaiAlerte || 0);
      poids._urgence = m.delaiUrgence === undefined ? 7 : Math.max(1, +m.delaiUrgence || 7);
      const o = { id: 'app', ach_counter: +m.achCounter || 0, bc_counter: +m.bcCounter || 0,
                  seuil_offres: +m.seuilOffres || 0, tva: +m.tva || 0, poids };
      /* si les colonnes dédiées existent (script SQL exécuté), on les alimente aussi */
      if (metaColonnesDelais){
        o.delai_alerte  = poids._alerte;
        o.delai_urgence = poids._urgence;
      }
      return o;
    },
    from: r => {
      metaColonnesDelais = Object.prototype.hasOwnProperty.call(r, 'delai_alerte');
      const brut = r.poids || {};
      const poids = {};
      Object.keys(brut).forEach(k => {
        if (k !== '_alerte' && k !== '_urgence') poids[k] = brut[k];
      });
      return {
        achCounter: +r.ach_counter || 0, bcCounter: +r.bc_counter || 0,
        seuilOffres: r.seuil_offres === undefined || r.seuil_offres === null ? 0 : +r.seuil_offres,
        tva: +r.tva || 0, poids,
        delaiAlerte: (metaColonnesDelais && r.delai_alerte !== undefined && r.delai_alerte !== null)
          ? +r.delai_alerte : (brut._alerte !== undefined && brut._alerte !== null ? +brut._alerte : 3),
        delaiUrgence: (metaColonnesDelais && r.delai_urgence !== undefined && r.delai_urgence !== null)
          ? +r.delai_urgence : (brut._urgence !== undefined && brut._urgence !== null ? +brut._urgence : 7)
      };
    }
  }
};

function createSupabaseSync(createClient, url, key) {
  const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });
  const snapshot = {};                 // table -> Map(id -> JSON de la ligne)
  let timer = null, busy = false, selfUntil = 0;
  let lastError = null, lastSyncAt = null;

  const rowsOf = (db, t) => (t === 'meta' ? [VN_MAP.meta.to((db && db.meta) || {})] : ((db && db[t]) || []).map(VN_MAP[t].to));
  const snapOf = rows => new Map(rows.map(r => [r.id, JSON.stringify(r)]));

  /* ---------- Lecture ---------- */
  async function fetchAll() {
    const out = {};
    for (const t of VN_TABLES) {
      const { data, error } = await client.from(t).select('*');
      if (error) { lastError = error.message; throw new Error(t + ' : ' + error.message); }
      if (t === 'meta') { out.meta = data && data.length ? VN_MAP.meta.from(data[0]) : null; }
      else out[t] = (data || []).map(VN_MAP[t].from);
    }
    /* base vide : on ne renvoie rien, l'app poussera son jeu de démo au 1er saveDB() */
    if (!out.users || !out.users.length) return null;
    if (!out.meta) out.meta = null;
    VN_TABLES.forEach(t => { snapshot[t] = snapOf(rowsOf(out, t)); });
    return out;
  }

  /* ---------- Écriture (différentielle) ---------- */
  async function push(db) {
    if (busy) { timer = setTimeout(() => push(db), 500); return; }
    busy = true; selfUntil = Date.now() + 1500;
    try {
      for (const t of VN_TABLES) {
        const rows = rowsOf(db, t);
        const next = snapOf(rows);
        const prev = snapshot[t] || new Map();
        if (t === 'meta') {
          const changed = !prev.size || prev.get('app') !== next.get('app');
          if (changed) {
            const { error } = await client.from('meta').upsert(rows);
            if (error) throw new Error('meta : ' + error.message);
          }
          snapshot[t] = next; continue;
        }
        const upserts = rows.filter(r => prev.get(r.id) !== next.get(r.id));
        const deletes = [...prev.keys()].filter(id => !next.has(id));
        if (upserts.length) {
          const { error } = await client.from(t).upsert(upserts);
          if (error) throw new Error(t + ' : ' + error.message);
        }
        if (deletes.length) {
          const { error } = await client.from(t).delete().in('id', deletes);
          if (error) throw new Error(t + ' (suppression) : ' + error.message);
        }
        snapshot[t] = next;
      }
      lastError = null; lastSyncAt = Date.now();
      return true;
    } catch (e) {
      lastError = e.message;
      return false;
    } finally {
      busy = false;
    }
  }
  /* Synchro différée : plusieurs saveDB() rapprochés = un seul aller-retour.
     « getDB » est une fonction : on pousse toujours l'état COURANT de
     l'application (jamais un instantané périmé capturé avant hydratation). */
  function sync(getDB) {
    clearTimeout(timer);
    timer = setTimeout(() => { push(typeof getDB === 'function' ? getDB() : getDB); }, 400);
  }
  /* Annule un envoi en attente (appelé juste après l'hydratation distante) */
  function cancelPending() { clearTimeout(timer); }

  /* ---------- Réinitialisation : on remplace tout le distant ---------- */
  async function reset(db) {
    busy = true; selfUntil = Date.now() + 3000;
    try {
      for (const t of ['notifications', 'receptions', 'orders', 'requests', 'suppliers', 'users', 'meta']) {
        const { error } = await client.from(t).delete().neq('id', '__rien__');
        if (error) throw new Error(t + ' : ' + error.message);
      }
      for (const t of VN_TABLES) {
        const rows = rowsOf(db, t);
        if (rows.length) {
          const { error } = await client.from(t).insert(rows);
          if (error) throw new Error(t + ' : ' + error.message);
        }
        snapshot[t] = snapOf(rows);
      }
      return true;
    } catch (e) { lastError = e.message; return false; }
    finally { busy = false; }
  }

  /* ---------- Temps réel ---------- */
  function subscribe(onChange) {
    try {
      const ch = client.channel('voomnet-sync')
        .on('postgres_changes', { event: '*', schema: 'public' }, () => {
          if (Date.now() < selfUntil) return;      // on ignore nos propres écritures
          onChange();
        })
        .subscribe();
      return () => { try { client.removeChannel(ch); } catch (e) { /* ignoré */ } };
    } catch (e) { return () => {}; }
  }

  return {
    client,
    enabled: () => true,
    tables: VN_TABLES,
    fetchAll, sync, push, reset, subscribe, cancelPending,
    getError: () => lastError,
    isSelfWrite: () => Date.now() < selfUntil,
    /* état affiché dans ⚙️ Paramètres (utile pour vérifier un déploiement Vercel) */
    status: () => ({
      configured: true,
      project: (String(url).replace(/^https?:\/\//, "").split(".")[0]) || "",
      online: !lastError,
      error: lastError,
      lastSyncAt: lastSyncAt
    })
  };
}

  debloquerAudio();          // le clic de connexion débloque l'audio du navigateur
  genererRappels();          // relances au moment de la connexion
  autoriserSons();           // les sons ne se déclenchent qu'après l'ouverture de session
  /* petit résumé sonore si des alertes sont en cours (uniquement pour l'utilisateur
     qui vient de se connecter : évite qu'une minuterie d'une session précédente
     joue un son pour quelqu'un d'autre) */
  const uidConnexion = sessionUser ? sessionUser.id : '';
  setTimeout(() => {
    if (!sonActif() || !sessionUser || sessionUser.id !== uidConnexion) return;
    const l = alertesActives().filter(a => {
      if (sessionUser.role === 'admin') return true;
      if (sessionUser.role === 'responsable') return a.cibles === 'responsable';
      return a.cibles === 'demandeur' && a.demandeurId === sessionUser.id;
    });
    if (l.some(a => a.niveau === 'urgent')) jouerSonNotif('urgent');
    else if (l.length) jouerSonNotif('alerte');
  }, 3000);
  go('dashboard');
}

function quitterAssistant(page, params, action){
  const dansWizard = state.page === 'nouvelleDemande';
  if (dansWizard && draft && page !== 'nouvelleDemande'){
    if (!(draft.articles || []).length){
      nettoyerDraftVide();                       /* NIVEAU 2 : rien à conserver */

      confirmModal('Quitter la demande en cours ?<br><span class="text-muted small">Le brouillon reste enregistré — vous pourrez le reprendre depuis « Mes demandes ».</span>',

    confirmModal('Abandonner la demande en cours et en créer une nouvelle ?', () => { action(page, params); });

/* Total d'une offre : somme des prix négociés par article × quantités
   (compatibilité : anciennes offres au champ « prix » unique) */
function calcOfferBrut(r, o){
  if (!o) return 0;
  if (o.prixArticles && Object.keys(o.prixArticles).length){
    return (r.articles || []).reduce((s, a, i) => s + (+(o.prixArticles[i] || 0)) * (+a.quantite || 0), 0);
  }
  return +o.prix || 0;
}

/* ================================================================
   AMÉLIORATIONS DE L'ÉTAPE 3 — COMPARAISON DES PRIX
   • offre complète + seuil paramétrable d'offres complètes
   • coût total rendu : remise (%) · TVA (%) · frais de livraison
   • score multicritère pondéré (prix / délai / garantie / paiement)
   • outils de saisie assistée + export de la comparaison
   ================================================================ */
const DEFAULT_POIDS = { prix: 50, delai: 20, garantie: 20, paiement: 10 };
const meta = () => (DB && DB.meta) ? DB.meta : {};
function poids(){
  const p = Object.assign({}, DEFAULT_POIDS, meta().poids || {});
  const s = ['prix','delai','garantie','paiement'].reduce((t, k) => t + (Math.max(0, +p[k] || 0)), 0);
  return s > 0 ? p : Object.assign({}, DEFAULT_POIDS);
}
function poidsTotal(){ const p = poids(); return ['prix','delai','garantie','paiement'].reduce((t,k) => t + (+p[k]||0), 0); }
function seuilOffres(){ const n = +meta().seuilOffres; return n >= 0 ? n : 3; }  /* 0 = prix facultatifs */
function tauxTVA(){ const n = +meta().tva; return n >= 0 ? n : 0; }

/* Une offre est « complète » quand chaque article a un prix négocié > 0 */
function offreComplete(r, o){
  if (!o) return false;
  const arts = r.articles || [];
  if (!arts.length) return false;
  return arts.every((a, i) => +(((o.prixArticles || {})[i])) > 0);
}
function offresCompletes(r){ return (r.supplierIds || []).filter(sid => offreComplete(r, (r.offers || {})[sid])); }
function prixSaisis(r){
  const sids = r.supplierIds || [], arts = r.articles || [];
  let nb = 0;
  sids.forEach(sid => arts.forEach((a, i) => { if (+(((r.offers || {})[sid] || {}).prixArticles || {})[i] > 0) nb++; }));
  return { nb, total: sids.length * arts.length };
}

/* Décomposition du coût : brut → remise → net HT → TVA → frais → coût total rendu */
function calcOfferBreakdown(r, o){
  const brut = calcOfferBrut(r, o);
  const remisePct = Math.max(0, Math.min(100, +(o && o.remise) || 0));
  const remise = Math.round(brut * remisePct / 100);
  const netHT = brut - remise;
  const tva = Math.round(netHT * tauxTVA() / 100);
  const fraisLivraison = Math.max(0, Math.round(+((o && o.fraisLivraison) || 0)));
  return { brut, remisePct, remise, netHT, tva, fraisLivraison, total: netHT + tva + fraisLivraison };
}
function calcOfferTotal(r, o){ return calcOfferBreakdown(r, o).total; }

/* Score multicritère — note sur 100 (pondération réglable dans ⚙️ Paramètres) */
function paymentDays(txt){
  const t = String(txt || '').toLowerCase().trim();
  if (!t) return null;
  if (/comptant|immediat|immédiat|avance/.test(t)) return 0;
  const mj = t.match(/(\d+)\s*(jour|j)\b/); if (mj) return +mj[1];
  const mm = t.match(/(\d+)\s*mois/);       if (mm) return +mm[1] * 30;
  const mn = t.match(/(\d+)/);              if (mn) return +mn[1];
  return null;
}
function paymentScore(txt){
  const d = paymentDays(txt);
  if (d === null) return 50;                       // conditions non précisées : neutre
  return Math.max(0, Math.min(100, 30 + d));       // 0 j → 30 · 30 j → 60 · 60 j → 90 · 90 j → 100
}
function scoresOffres(r){
  const sids = offresCompletes(r);
  if (!sids.length) return {};
  const p = poids(), tot = Math.max(1, poidsTotal());
  const off = r.offers || {};
  const totals = {}, delais = {}, gars = {}, pai = {};
  sids.forEach(sid => {
    const o = off[sid] || {};
    totals[sid] = calcOfferTotal(r, o);
    delais[sid] = +o.delai || 0;
    gars[sid]   = +o.garantie || 0;
    pai[sid]    = paymentScore(o.paiement);
  });
  const minT = Math.min(...sids.map(s => totals[s]));
  const dPos = sids.map(s => delais[s]).filter(x => x > 0);
  const gPos = sids.map(s => gars[s]).filter(x => x > 0);
  const minD = dPos.length ? Math.min(...dPos) : 0;
  const maxG = gPos.length ? Math.max(...gPos) : 0;
  const out = {};
  sids.forEach(sid => {
    const sPrix = minT > 0 ? Math.max(0, Math.min(100, 100 * minT / totals[sid])) : 0;
    const sDel  = (delais[sid] > 0 && minD > 0) ? Math.max(0, Math.min(100, 100 * minD / delais[sid])) : 50;
    const sGar  = maxG > 0 ? Math.max(0, Math.min(100, 100 * gars[sid] / maxG)) : 50;
    const sPai  = pai[sid];
    const note  = (sPrix*(+p.prix||0) + sDel*(+p.delai||0) + sGar*(+p.garantie||0) + sPai*(+p.paiement||0)) / tot;
    out[sid] = { note: Math.round(note), prix: Math.round(sPrix), delai: Math.round(sDel), garantie: Math.round(sGar), paiement: Math.round(sPai), total: totals[sid] };
  });
  return out;
}
function meilleureOffre(r){
  const s = scoresOffres(r);
  const best = Object.entries(s).sort((a, b) => b[1].note - a[1].note || a[1].total - b[1].total)[0];
  return best ? Object.assign({ sid: best[0] }, best[1]) : null;
}
/* Classement des offres complètes par coût total rendu croissant */
function classementOffres(r){
  return offresCompletes(r)
    .map(sid => ({ sid, total: calcOfferTotal(r, (r.offers || {})[sid]) }))
    .sort((a, b) => a.total - b.total)
    .reduce((acc, x, i) => { acc[x.sid] = i + 1; return acc; }, {});
}
/* Meilleur prix négocié pour un article (offres complètes uniquement) */
function meilleurPrixArticle(r, i){
  const sids = offresCompletes(r);
  const vals = sids.map(sid => +(((((r.offers || {})[sid] || {}).prixArticles) || {})[i]) || 0).filter(v => v > 0);
  return vals.length ? Math.min(...vals) : null;
}
const fmtPct = n => (Math.round(+n || 0)) + ' %';
function ecartPctHTML(neg, pres){

function scoreBar(note){
  const n = Math.max(0, Math.min(100, +note || 0));
  const couleur = n >= 75 ? 'var(--green)' : n >= 50 ? 'var(--amber)' : 'var(--red)';

}
const RANG_ICON = ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
function rangBadge(n){ return `<span class="rank">${RANG_ICON[n - 1] || ('#' + n)} ${n === 1 ? 'Meilleur total' : ('Rang ' + n)}</span>`; }

function pushHist(r, ev, date){

/* Meilleures offres : 💰 meilleur total · 🚚 livraison la plus rapide · 🛡️ meilleure garantie */
function bestOffers(r){
  const sids = r.supplierIds || [];
  /* seules les offres COMPLÈTES (tous les articles chiffrés) concourent au meilleur total */
  const withTotal = offresCompletes(r);
  const withDelai = sids.filter(id => +(((r.offers || {})[id] || {}).delai) > 0);
  const withGar   = sids.filter(id => +(((r.offers || {})[id] || {}).garantie) > 0);
  const minT = withTotal.length ? Math.min(...withTotal.map(id => calcOfferTotal(r, r.offers[id]))) : null;
  const minD = withDelai.length ? Math.min(...withDelai.map(id => +r.offers[id].delai)) : null;
  const maxG = withGar.length   ? Math.max(...withGar.map(id => +r.offers[id].garantie)) : null;
  return {
    prix:  minT === null ? [] : withTotal.filter(id => calcOfferTotal(r, r.offers[id]) === minT),
    delai: minD === null ? [] : withDelai.filter(id => +r.offers[id].delai === minD),
    gar:   maxG === null ? [] : withGar.filter(id => +r.offers[id].garantie === maxG)
  };
}
function chipsFor(r, sid){
  const b = bestOffers(r); let h = '';
  if (b.prix.includes(sid))  h += '<span class="chip">💰 Meilleur coût total</span>';
  if (b.delai.includes(sid)) h += '<span class="chip">🚚 Livraison la plus rapide</span>';
  if (b.gar.includes(sid))   h += '<span class="chip">🛡️ Meilleure garantie</span>';
  const best = meilleureOffre(r);
  if (best && best.sid === sid && Object.keys(scoresOffres(r)).length > 1)
    h += `<span class="chip chip-score">⭐ Meilleur score (${best.note}/100)</span>`;
  return h;
}

/* Barre d'outils de saisie assistée + compteur de saisie + seuil d'offres complètes */
function negoToolbarHTML(r){

  const pct = total ? Math.round(100 * nb / total) : 0;
  const complets = offresCompletes(r).length, seuil = seuilOffres();
  const ok = complets >= seuil;
  return `
  <div class="nego-toolbar">
    <div class="nego-tools">
      <button class="btn outline sm" data-act="nego-prefill" title="Remplir les cases vides avec le coût présumé de chaque article">📋 Pré-remplir (coût présumé)</button>
      <button class="btn outline sm" data-act="nego-copyrows" title="Recopier le 1er prix saisi de chaque ligne sur tous les fournisseurs">⇉ Recopier par ligne</button>

}

/* Réglage de la pondération du score multicritère */
function negoPoidsHTML(){
  const p = poids();
  const f = (k, label) => `<label class="poids-item"><span>${label}</span><input type="number" min="0" max="100" step="5" data-poids="${k}" value="${+p[k] || 0}"></label>`;
  return `<details class="poids-box">
    <summary>⚙️ Pondération du score multicritère — total <b data-poids-sum>${poidsTotal()}</b> %</summary>
    <div class="poids-grid">${f('prix', '💰 Prix')}${f('delai', '🚚 Délai')}${f('garantie', '🛡️ Garantie')}${f('paiement', '💳 Paiement')}</div>
    <p class="text-muted small">Le score va à l'offre la moins chère, la plus rapide, la mieux garantie et aux conditions de paiement les plus favorables. Le réglage est commun à toutes les demandes.</p>
  </details>`;
}

function negotiationHTML(r){
  const sids = r.supplierIds || [];
  const off = r.offers || {};

  const synthese = [

    ligne(`💵 <b>TVA (${fmtPct(tva)})</b>`, 'réglable dans ⚙️ Paramètres', sid => cout[sid].tva),
    ligne('🚛 <b>Frais de livraison (FCFA)</b>', '', sid => cout[sid].frais),
    ligne('⭐ <b>COÛT TOTAL RENDU</b>', 'net HT + TVA + livraison', sid => cout[sid].total),
    ligne('📈 <b>Écart vs somme présumée</b>', `Présumé : ${fmtM(pres)}`, sid => cout[sid].ecart),
    ligne('⭐ <b>SCORE GLOBAL (/100)</b>', 'prix · délai · garantie · paiement', sid => scoreCellHTML(r, sid))

    : '<div class="chosen-banner" data-bestbanner style="display:none"></div>';

  return `

  <div class="chosen-banner" style="background:#f5e9fb;border-color:var(--primary);color:#3b0053">📞 Négociez <b>article par article</b> auprès de chaque fournisseur : saisissez le prix unitaire obtenu — le total de la ligne, le coût total rendu (remise, TVA, livraison) et le <b>score multicritère</b> se calculent automatiquement.</div>
  ${banner}
  ${negoPoidsHTML()}

/* Recalcul en direct de toute la grille (sans perdre le focus de la cellule saisie) */
function refreshNegoLive(r, focusSid, focusIdx){
  const sids = r.supplierIds || [], off = r.offers || {};
  const nbArt = (r.articles || []).length;
  const rangs = classementOffres(r);
  const sc = scoresOffres(r);
  const { nb, total } = prixSaisis(r);
  const cnt = $('[data-nego-count]'); if (cnt) cnt.innerHTML = `<b>${nb}</b> / ${total} prix saisis`;
  const bar = $('[data-nego-bar]'); if (bar) bar.style.width = (total ? Math.round(100 * nb / total) : 0) + '%';
  const seuilEl = $('[data-nego-seuil]');
  if (seuilEl){
    const c = offresCompletes(r).length, s = seuilOffres();
    seuilEl.className = 'badge ' + (c >= s ? 'b-green' : 'b-amber');
    seuilEl.textContent = `${c} offre${c > 1 ? 's' : ''} complète${c > 1 ? 's' : ''} — minimum ${s}`;
  }
  sids.forEach(sid => {
    const o = off[sid] || {}, complet = offreComplete(r, o), b = calcOfferBreakdown(r, o);
    const cm = $(`[data-cmplt="${sid}"]`);
    if (cm){ const n = (r.articles || []).filter((a, i) => +((o.prixArticles || {})[i]) > 0).length;
      cm.textContent = `${n} / ${nbArt} article${nbArt > 1 ? 's' : ''} chiffré${nbArt > 1 ? 's' : ''}`; }
    const rg = $(`[data-rangof="${sid}"]`); if (rg) rg.innerHTML = complet ? rangBadge(rangs[sid]) : '<span class="badge b-amber">⚠️ SANS RÉPONSE</span>';
    const bl = $(`[data-badgelist="${sid}"]`); if (bl) bl.innerHTML = chipsFor(r, sid);
    const c = coutCellHTML(r, sid);
    /* remplacement des cellules de coût en conservant l'attribut de ciblage */
    const upd = (attr, html) => {
      const el = $(`[${attr}="${sid}"]`); if (!el) return;
      const tmp = document.createElement('table'); tmp.innerHTML = '<tr>' + html + '</tr>';
      const td = tmp.querySelector('td'); td.setAttribute(attr, sid); el.replaceWith(td);
    };
    upd('data-brutof', c.brut);
    const rem = $(`[data-remiseof="${sid}"]`); if (rem) rem.innerHTML = b.remise ? '− ' + fmtM(b.remise) : '';
    upd('data-netof', c.net); upd('data-tvaof', c.tva);
    upd('data-totalof', c.total); upd('data-ecartof', c.ecart); upd('data-scoreof', scoreCellHTML(r, sid));
  });
  (r.articles || []).forEach((a, i) => {
    const bestP = meilleurPrixArticle(r, i);
    sids.forEach(sid => {
      const p = +((((off[sid] || {}).prixArticles) || {})[i]) || 0;
      const td = $(`[data-cell="${sid}-${i}"]`);
      if (td) td.classList.toggle('cellbest', bestP !== null && p > 0 && p === bestP);
      if (!(sid === focusSid && i === focusIdx)){
        const lt = $(`[data-lt="${sid}-${i}"]`); if (lt) lt.innerHTML = lineTotalHTML(a, p);
        const ec = $(`[data-ec="${sid}-${i}"]`); if (ec) ec.innerHTML = ecartPctHTML(p, +a.prix);
      }
    });
  });
  if (focusSid && focusIdx !== undefined && focusIdx !== null){
    const a = (r.articles || [])[focusIdx];
    const v = +((((off[focusSid] || {}).prixArticles) || {})[focusIdx]) || 0;
    const lt = $(`[data-lt="${focusSid}-${focusIdx}"]`); if (lt) lt.innerHTML = lineTotalHTML(a, v);
    const ec = $(`[data-ec="${focusSid}-${focusIdx}"]`); if (ec) ec.innerHTML = ecartPctHTML(v, +a.prix);
  }
  /* Bannière « meilleure offre globale » */
  const best = meilleureOffre(r);
  const bb = $('[data-bestbanner]');
  if (bb) bb.innerHTML = best
    ? `🏆 <b>Meilleure offre globale : ${esc(suppName(best.sid))}</b> — score <b>${best.note}/100</b> pour un coût total rendu de <b>${fmtM(best.total)}</b>.`
    : '';
}

/* Grille fournisseurs : saisie des nouveaux prix négociés (modifiable)
   ou comparaison croisée des offres (lecture, meilleures offres surlignées) */

/* Cellules « coût » en lecture seule (comparaison étape 4 et détail de la demande) */
function coutROCellHTML(r, sid){
  const o = (r.offers || {})[sid] || {}, b = calcOfferBreakdown(r, o);
  const cls = sid === r.chosenSupplierId ? 'colchosen' : '';
  const pres = totalEstimatif(r);
  let ecart = '—', coul = '';
  if (b.total && pres){
    const d = pres - b.total;
    coul = ` style="font-weight:800;color:${d >= 0 ? 'var(--green)' : 'var(--red)'}"`;
    ecart = `${d >= 0 ? '− ' : '+ '}${fmtM(Math.abs(d))}<div class="cell-sub">${fmtPct(Math.abs(d) / pres * 100)}</div>`;
  }
  return {
    brut:   `<td class="${cls}">${b.brut ? fmtM(b.brut) : '—'}</td>`,
    remise: `<td class="${cls}">${b.remisePct ? b.remisePct + ' %<div class="cell-sub">− ' + fmtM(b.remise) + '</div>' : '—'}</td>`,
    net:    `<td class="${cls}">${b.netHT ? fmtM(b.netHT) : '—'}</td>`,
    tva:    `<td class="${cls}">${b.tva ? fmtM(b.tva) : '—'}</td>`,
    frais:  `<td class="${cls}">${b.fraisLivraison ? fmtM(b.fraisLivraison) : '—'}</td>`,
    total:  `<td class="${cls} cell-total"><b style="font-size:14px">${b.total ? fmtM(b.total) : '—'}</b></td>`,
    ecart:  `<td class="${cls}"${coul}>${ecart}</td>`
  };
}
function scoreCellHTML(r, sid, extraCls){
  const sc = scoresOffres(r)[sid];
  const cls = ((sid === r.chosenSupplierId ? 'colchosen ' : '') + (extraCls || '')).trim();
  if (!sc) return `<td class="${cls}" data-scoreof="${sid}"><span class="badge b-amber">NON ÉVALUÉ</span><div class="cell-sub">offre incomplète</div></td>`;
  return `<td class="${cls}" data-scoreof="${sid}"><b style="font-size:14px">${sc.note}</b><span class="cell-sub">/100</span>
    ${scoreBar(sc.note)}
    <div class="cell-sub">💰${sc.prix} · 🚚${sc.delai} · 🛡️${sc.gar} · 💳${sc.paiement}</div></td>`;
}

function comparisonHTML(r, editable){
  const sids = r.supplierIds || [];
  const off = r.offers || {};
  const pres = totalEstimatif(r);
  const rangs = classementOffres(r);
  const nbArt = (r.articles || []).length;
  const tva = tauxTVA();

  const head = sids.map(sid => {
    const chosen = sid === r.chosenSupplierId;
    const complet = offreComplete(r, off[sid]);
    const n = (r.articles || []).filter((a, i) => +(((off[sid] || {}).prixArticles || {})[i]) > 0).length;
    return `<th class="${chosen ? 'colchosen' : ''}"><span class="who">${esc(suppName(sid))}</span>

      ${!editable ? `<div class="th-sub">${n} / ${nbArt} chiffrés</div><div>${complet ? rangBadge(rangs[sid]) : '<span class="badge b-amber">⚠️ SANS RÉPONSE</span>'}</div>` : ''}
      <span data-badgelist="${sid}">${chipsFor(r, sid)}</span></th>`;
  }).join('');

  const rows = [];
  (r.articles || []).forEach((a, i) => {
    const bestP = meilleurPrixArticle(r, i);
    const cells = sids.map(sid => {
      const o = off[sid] || {};
      const chosen = sid === r.chosenSupplierId;
      const cls = chosen ? 'colchosen' : '';
      const p = +((o.prixArticles || {})[i]) || 0;
      if (editable){
        return `<td class="nego-cell ${cls}" data-cell="${sid}-${i}"><input type="number" min="0" step="500" data-of="${sid}" data-ai="${i}" value="${p || ''}" placeholder="Prix négocié">
          <div data-lt="${sid}-${i}">${lineTotalHTML(a, p)}</div><div data-ec="${sid}-${i}">${ecartPctHTML(p, +a.prix)}</div></td>`;
      }
      if (!p) return `<td class="${cls}"><span class="badge b-red">NON RENSEIGNÉ</span></td>`;
      const best = bestP !== null && p === bestP;
      return `<td class="${cls}${best ? ' cellbest' : ''}">${fmtM(p)}
        <div class="cell-sub">× ${a.quantite} = <b>${fmtM(p * (+a.quantite || 0))}</b></div>
        <div>${ecartPctHTML(p, +a.prix)}</div>
        ${best ? '<br><span class="chip">💰 Meilleur prix</span>' : ''}</td>`;
    }).join('');
    rows.push(`<tr><td>📦 <b>${esc(a.designation)}</b><div class="cell-sub">Quantité : ${a.quantite} · coût présumé : ${fmtM(a.prix)}</div></td>${cells}</tr>`);
  });

  /* Synthèse financière + score multicritère */
  const cRO = {}, cED = {};
  sids.forEach(sid => { cRO[sid] = coutROCellHTML(r, sid); cED[sid] = coutCellHTML(r, sid); });
  const ligne = (label, sub, key) => `<tr><td>${label}${sub ? `<div class="cell-sub">${sub}</div>` : ''}</td>${sids.map(sid => (editable ? cED[sid][key] : cRO[sid][key])).join('')}</tr>`;
  rows.push(ligne('💰 <b>TOTAL ARTICLES (brut)</b>', 'prix négociés × quantités', 'brut'));
  rows.push(ligne('🏷️ <b>Remise commerciale</b>', '', 'remise'));
  rows.push(ligne('🧾 <b>NET HT</b>', 'après remise', 'net'));
  rows.push(ligne(`💵 <b>TVA (${fmtPct(tva)})</b>`, '', 'tva'));
  rows.push(ligne('🚛 <b>Frais de livraison</b>', '', 'frais'));
  rows.push(ligne('⭐ <b>COÛT TOTAL RENDU</b>', 'net HT + TVA + livraison', 'total'));
  rows.push(ligne('📈 <b>Écart vs somme présumée</b>', `Présumé : ${fmtM(pres)}`, 'ecart'));
  rows.push(`<tr><td>⭐ <b>SCORE GLOBAL (/100)</b><div class="cell-sub">prix · délai · garantie · paiement</div></td>${sids.map(sid => scoreCellHTML(r, sid)).join('')}</tr>`);

  const crit = (icon, label, f, fmt, type, extra) => `<tr><td>${icon} ${label}</td>${sids.map(sid => {
    const o = off[sid] || {};
    const chosen = sid === r.chosenSupplierId;
    const v = o[f];
    const show = (v === undefined || v === null || v === '') ? '' : ((f === 'delai' || f === 'garantie') && !+v) ? '' : v;
    if (editable && f) return `<td class="${chosen ? 'colchosen' : ''}"><input type="${type || 'text'}" ${extra || ''} data-of="${sid}" data-f="${f}" value="${esc(show)}"></td>`;
    return `<td class="${chosen ? 'colchosen' : ''}">${fmt(o)}</td>`;
  }).join('')}</tr>`;
  rows.push(crit('🚚', 'Délai de livraison', 'delai', o => fmtDel(o.delai), 'number', 'min="0"'));
  rows.push(crit('🛡️', 'Garantie', 'garantie', o => fmtGar(o.garantie), 'number', 'min="0" step="0.5"'));
  rows.push(crit('💳', 'Conditions de paiement', 'paiement', o => esc(o.paiement || '—'), 'text', 'class="wide" placeholder="ex : 30 jours"'));
  rows.push(crit('📝', 'Observations', 'observations', o => esc(o.observations || '—'), 'text', 'class="wide"'));

  const best = meilleureOffre(r);
  const banner = (!editable && best)
    ? `<div class="chosen-banner">🏆 <b>Meilleure offre globale : ${esc(suppName(best.sid))}</b> — score <b>${best.note}/100</b> pour un coût total rendu de <b>${fmtM(best.total)}</b>.</div>`
    : '';
  const note = editable
    ? `<p class="hint text-muted small" style="margin-top:8px">📞 Après avoir <b>appelé chaque fournisseur</b>, saisissez ici les <b>nouveaux prix négociés</b> article par article, ainsi que le délai, la garantie et les conditions obtenues. Les totaux, le coût rendu et les scores se mettent à jour automatiquement.</p>`
    : `<p class="hint text-muted small" style="margin-top:8px">💰 Surligné en vert : <b>meilleur prix négocié</b> pour chaque article. Le <b>coût total rendu</b> intègre la remise, la TVA (${fmtPct(tva)}) et les frais de livraison ; le <b>score</b> pondère le prix, le délai, la garantie et le paiement. Les fournisseurs sans réponse complète sont exclus du classement.</p>`;
  return ` ${banner}<div class="cmp-scroll"><table class="cmp"><tr><th>Article \ Fournisseur</th>${head}</tr>${rows.join('')}</table></div>${note}`;
}

/* ---- Modales ---- */
function modal(title, bodyHTML, buttons, wide){
  $('#modal-root').innerHTML =
    `<div class="modal-overlay" data-act="modal-close"></div>
     <div class="modal ${wide?'wide':''}">
       <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" data-act="modal-close">✕</button></div>
       <div class="modal-body">${bodyHTML}</div>
       <div class="modal-foot">${(buttons||[]).map((b,i)=>`<button class="btn ${b.cls||'outline'}" data-mbtn="${i}">${b.label}</button>`).join('')}</div>
     </div>`;
  $('#modal-root').classList.add('open');
  $('#modal-root').querySelectorAll('[data-mbtn]').forEach(btn => {
    btn.addEventListener('click', () => {
      const b = buttons[+btn.dataset.mbtn];
      if (b && b.act) b.act();
      else closeModal();
    });
  });
}
function closeModal(){ $('#modal-root').classList.remove('open'); $('#modal-root').innerHTML = ''; }
function confirmModal(text, onYes, yesLabel){
  modal('Confirmation', `<p style="font-size:14px">${text}</p>`, [
    {label:'Annuler', cls:'outline'},
    {label: yesLabel || 'Confirmer', cls:'primary', act: () => { closeModal(); onYes(); }}
  ]);
}

/* ---- Toasts ---- */
function toast(msg, type){
  /* petit signal sonore pour les messages importants (erreur / avertissement) */
  if (sonPret && sessionUser && sonActif()){
    if (type === 'err') jouerSonNotif('urgent');
    else if (type === 'warn') jouerSonNotif('alerte');
  }
  const d = document.createElement('div');
  d.className = 'toast ' + (type || '');
  d.innerHTML = (type === 'ok' ? '✅ ' : type === 'err' ? '⛔ ' : type === 'warn' ? '⚠️ ' : 'ℹ️ ') + esc(msg);
  $('#toast-root').appendChild(d);
  setTimeout(() => d.remove(), 4000);
}

/* ---- Notifications ---- */
function notify(userId, texte, opts){
  const o = opts || {};
  DB.notifications.unshift({ id:uid('n'), userId, texte, date:nowISO(), lu:false,
    niveau: o.niveau || 'info', cle: o.cle || '', requestId: o.requestId || '' });
  /* son + bulle système, uniquement pour l'utilisateur connecté, jamais au démarrage */
  if (sessionUser && userId === sessionUser.id){
    const nv = o.niveau || 'info';
    if (sonPret) jouerSonNotif(nv);           /* le son, lui, attend la fin du démarrage */
    if (notifNavActivePour(nv)) notifierNavigateur(titreNotif(nv), texte, o.requestId || '');
  }
}
function notifyRole(role, texte){ DB.users.filter(u => u.role === role && u.statut === 'Actif').forEach(u => notify(u.id, texte)); }
function unreadCount(){ return DB.notifications.filter(n => n.userId === sessionUser.id && !n.lu).length; }
function updateBell(){
  const n = unreadCount(); const b = $('#bell-badge');
  b.textContent = n; b.style.display = n ? 'flex' : 'none';
}
const notifIcon = (n) => n.niveau === 'urgent' ? '🔴' : n.niveau === 'alerte' ? '🟠' : '🔵';

/* ---------- Sons de notification (Web Audio API : aucun fichier à télécharger,
   fonctionne donc aussi dans la version autonome et hors-ligne) ---------- */
const SON_CLE = 'voomnet_son';
let audioCtx = null;
const sonActif = () => storage.getItem(SON_CLE) !== '0';          // actif par défaut
function setSonActif(on){ storage.setItem(SON_CLE, on ? '1' : '0'); }
const VOL_CLE = 'voomnet_volume';
const volumes = { faible: 0.6, moyen: 1, fort: 1.6 };
function volumeSon(){ const v = storage.getItem(VOL_CLE); return volumes[v] || 1.6; }   /* « fort » par défaut */
function setVolumeSon(v){ storage.setItem(VOL_CLE, volumes[v] ? v : 'fort'); }
let sonPret = false;                                              // évite les bips au démarrage
function autoriserSons(){ setTimeout(() => { sonPret = true; }, 2500); }

/* Les navigateurs bloquent l'audio tant qu'aucune interaction n'a eu lieu :
   on crée / réactive le contexte audio dès le premier clic ou appui sur une touche. */
function contexteAudio(){
  try {
    const Ctx = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state !== 'running' && audioCtx.resume){ try { audioCtx.resume(); } catch(e){} }
    return audioCtx;
  } catch(e){ return null; }
}
function debloquerAudio(){
  const ctx = contexteAudio();
  return !!ctx && ctx.state === 'running';
}
function installerDeblocageAudio(){
  const unlock = () => {
    debloquerAudio();
    document.removeEventListener('pointerdown', unlock, true);
    document.removeEventListener('keydown', unlock, true);
    document.removeEventListener('touchstart', unlock, true);
  };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
  document.addEventListener('touchstart', unlock, true);
}

/* ---------- NOTIFICATIONS DU NAVIGATEUR (bulles système) ----------
   Elles s'affichent même si l'onglet VOOMNET est en arrière-plan, là où
   l'alarme sonore ne peut rien (le navigateur suspend l'audio). */
const NOTIF_NAV_CLE = 'voomnet_notifnav';
function notifNavSouhaitee(){ return storage.getItem(NOTIF_NAV_CLE) === '1'; }
function notifNavDisponible(){
  return typeof window !== 'undefined' && typeof window.Notification !== 'undefined';
}
function notifNavEtat(){
  if (!notifNavDisponible()) return 'indisponible';
  const P = window.Notification.permission;
  if (P === 'granted') return notifNavSouhaitee() ? 'active' : 'autorisee';
  if (P === 'denied')  return 'refusee';
  return 'vierge';
}
const notifNavLabel = {
  active: 'activées 🔔', autorisee: 'autorisées mais désactivées',
  refusee: 'refusées par le navigateur', vierge: 'non activées',
  indisponible: 'non gérées par ce navigateur'
};
function activerNotifNav(){
  if (!notifNavDisponible()){ toast('Ce navigateur ne gère pas les notifications système.', 'warn'); return; }
  const demande = window.Notification.requestPermission();
  const suite = (p) => {
    if (p === 'granted'){
      storage.setItem(NOTIF_NAV_CLE, '1');
      notifierNavigateur('VOOMNET — notifications activées',
        'Vous serez prévenu même si l\'onglet est en arrière-plan.');
      toast('Notifications du navigateur activées 🔔', 'ok');
    } else {
      storage.setItem(NOTIF_NAV_CLE, '0');
      toast('Autorisation refusée — réactivez-la dans les réglages du navigateur (icône 🔒 à gauche de l\'adresse).', 'warn');
    }
    render();
  };
  if (demande && demande.then) demande.then(suite).catch(() => toast('Demande impossible', 'err'));
  else suite(window.Notification.permission);
}
function desactiverNotifNav(){
  storage.setItem(NOTIF_NAV_CLE, '0');
  toast('Notifications du navigateur désactivées', 'ok'); render();
}
function notifNavActivePour(niveau){
  if (!notifNavSouhaitee() || !notifNavDisponible()) return false;
  if (window.Notification.permission !== 'granted') return false;
  const cfg = alarmeCfg();
  if (cfg.niveaux === 'urgent') return niveau === 'urgent';
  if (cfg.niveaux === 'urgent_alerte') return niveau === 'urgent' || niveau === 'alerte';
  return true;
}
function notifierNavigateur(titre, corps, requestId){
  try {
    if (!notifNavDisponible() || window.Notification.permission !== 'granted') return;
    const n = new window.Notification(titre, { body: corps, icon: LOGO_URL(), tag: requestId || 'voomnet' });
    n.onclick = (e) => {
      try { window.focus(); } catch(err){ /* ignoré */ }
      if (requestId) go('detailDemande', { id: requestId, nav: 'mesDemandes' });
      n.close();
    };
  } catch(e){ /* ignoré */ }
}
const titreNotif = (nv) => 'VOOMNET — ' + (nv === 'urgent' ? '🔴 urgence' : nv === 'alerte' ? '🟠 alerte' : '🔵 information');

/* ---------- ALARME RÉPÉTÉE ----------
   Tant qu'il reste des notifications non lues éligibles, la mélodie est
   rejouée à intervalle régulier. Elle s'arrête dès que les messages sont
   lus, si l'utilisateur coupe les sons, ou après un nombre max de
   répétitions (pour ne pas sonner indéfiniment sur un poste inoccupé). */
const ALARME_CLE = 'voomnet_alarme';
function alarmeCfg(){
  let c = {};
  try { c = JSON.parse(storage.getItem(ALARME_CLE) || '{}') || {}; } catch(e){ c = {}; }
  return {
    actif:   c.actif !== false,
    delai:   Math.max(5, +c.delai || 15),
    max:     Math.max(1, +c.max || 10),
    niveaux: c.niveaux || 'tous'        // tous | urgent_alerte | urgent
  };
}
function setAlarmeCfg(c){ storage.setItem(ALARME_CLE, JSON.stringify(c)); }

function notifsAlarme(){
  if (!sessionUser) return [];
  const cfg = alarmeCfg();
  return (DB.notifications || []).filter(n => {
    if (n.userId !== sessionUser.id || n.lu) return false;
    const nv = n.niveau || 'info';
    if (cfg.niveaux === 'urgent') return nv === 'urgent';
    if (cfg.niveaux === 'urgent_alerte') return nv === 'urgent' || nv === 'alerte';
    return true;
  });
}
function niveauLePlusFort(liste){
  if (liste.some(n => n.niveau === 'urgent')) return 'urgent';
  if (liste.some(n => n.niveau === 'alerte')) return 'alerte';
  return 'info';
}

let alarmeRepetitions = 0, alarmeEnCours = false;
/* Alerte VISUELLE de secours : le titre de l'onglet clignote tant qu'il reste
   des alertes non lues (utile si le son est coupé ou inaudible sur le poste). */
const TITRE_NORMAL = 'VOOMNET — Gestion des Achats';
let titreTimer = null, titreAlterne = false;
function majAlerteVisuelle(nb){
  const badge = $('#bell-badge');
  if (badge) badge.classList.toggle('alarme', nb > 0);
  if (!nb){
    if (titreTimer){ clearInterval(titreTimer); titreTimer = null; }
    titreAlterne = false;
    try { document.title = TITRE_NORMAL; } catch(e){}
    return;
  }
  const peindre = () => {
    titreAlterne = !titreAlterne;
    try { document.title = titreAlterne ? `🔴 ${nb} ALERTE${nb > 1 ? 'S' : ''} — VOOMNET` : TITRE_NORMAL; } catch(e){}
  };
  peindre();
  if (!titreTimer) titreTimer = setInterval(peindre, 1200);
}
function jouerAcquittement(){
  sonPret = true;
  try { bipe(523, 0, .13, .26); bipe(784, .15, .24, .26); } catch(e){ /* ignoré */ }
}
function majEtatAlarme(enCours){
  alarmeEnCours = !!enCours;
  const b = $('#btn-son'); if (b) b.classList.toggle('alarme', alarmeEnCours);
}
function arreterAlarme(acquitter){
  alarmeRepetitions = 0;
  majEtatAlarme(false);
  majAlerteVisuelle(0);
  /* bip de confirmation : dès que des messages non lus viennent d'être acquittés,
     même si l'alarme s'était déjà tue d'elle-même (maximum atteint) */
  if (acquitter && sonActif()) jouerAcquittement();
}
function surveillerAlarme(){
  if (!sessionUser || !sonActif()){ arreterAlarme(false); return; }
  const cfg = alarmeCfg();
  if (!cfg.actif){ alarmeRepetitions = 0; majEtatAlarme(false); return; }
  const nonLues = notifsAlarme();
  majAlerteVisuelle(nonLues.length);
  if (!nonLues.length){ if (alarmeEnCours) arreterAlarme(true); else alarmeRepetitions = 0; return; }
  /* on n'insiste pas si l'onglet est en arrière-plan (les navigateurs
     suspendent de toute façon les minuteries et l'audio) */
  if (typeof document !== 'undefined' && document.visibilityState === 'hidden') return;
  if (alarmeRepetitions >= cfg.max){ majEtatAlarme(false); return; }   // assez insisté : on garde le badge visuel
  if (Date.now() - dernierSon >= cfg.delai * 1000){
    alarmeRepetitions++;
    jouerSonNotif(niveauLePlusFort(nonLues), true);
    majEtatAlarme(true);
  }
}
function demarrerSurveillanceAlarme(){ setInterval(surveillerAlarme, 4000); }

/* État réel du son (affiché dans ⚙️ Paramètres pour diagnostiquer) */
function sonEtat(){
  try {
    const Ctx = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (audioCtx && audioCtx.state === 'running') return 'webaudio';
    if (!Ctx) return typeof window.Audio === 'function' ? 'secours' : 'indisponible';
    if (audioCtx && audioCtx.state === 'suspended') return 'bloque';
    return 'pret';
  } catch(e){ return 'indisponible'; }
}
const sonEtatLabel = () => ({
  webaudio: 'opérationnel (Web Audio)',
  pret: 'prêt — le son partira au premier clic',
  bloque: 'bloqué par le navigateur — cliquez sur 🔊 en haut à droite',
  secours: 'mode secours (Web Audio indisponible)',
  indisponible: 'audio non géré par ce navigateur'
})[sonEtat()] || 'inconnu';

/*Son de secours : on fabrique un WAV en mémoire (aucun fichier) et on le joue
   avec une balise <audio>. Cela contourne les navigateurs qui gardent le
   contexte Web Audio « suspendu » malgré le déblocage. */
function bipeWav(freq, duree, volume){
  try {
    if (typeof window === 'undefined' || typeof window.Audio !== 'function') return false;
    const sr = 22050, n = Math.max(1, Math.floor(sr * duree));
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const texte = (o, t) => { for (let k = 0; k < t.length; k++) v.setUint8(o + k, t.charCodeAt(k)); };
    texte(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); texte(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    texte(36, 'data'); v.setUint32(40, n * 2, true);
    for (let k = 0; k < n; k++){
      const t = k / sr;
      const enveloppe = Math.min(1, t / 0.008) * Math.exp(-t * 3.2);
      const echant = Math.sin(2 * Math.PI * freq * t) * enveloppe * Math.max(0, Math.min(1, volume));
      v.setInt16(44 + k * 2, echant * 32767, true);
    }
    const octets = new Uint8Array(buf);
    let binaire = '';
    for (let k = 0; k < octets.length; k += 4096) binaire += String.fromCharCode.apply(null, octets.subarray(k, k + 4096));
    const a = new window.Audio('data:audio/wav;base64,' + btoa(binaire));
    a.volume = 1;
    const p = a.play(); if (p && p.catch) p.catch(() => {});
    return true;
  } catch(e){ return false; }
}

function bipe(freq, decalage, duree, vol){
  const volume = Math.min(1, (vol || 0.2) * volumeSon());
  /* 1. Web Audio si le contexte tourne réellement */
  try {
    const ctx = contexteAudio();
    if (ctx && ctx.state === 'running'){
      const t0 = ctx.currentTime + decalage;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';                       /* plus audible que la sinusoïde */
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(volume, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + duree + 0.03);
      return;
    }
  } catch(e){ /* on bascule sur le secours */ }
  /* 2. Sinon : WAV généré à la volée */
  setTimeout(() => bipeWav(freq, duree, Math.min(1, volume * 3.2)), Math.max(0, decalage * 1000));
}

/* Mélodies : une note = information, deux = alerte, trois aiguës = urgence */
let dernierSon = 0;
function jouerSonNotif(niveau, force){
  if (!sonActif() || !sessionUser) return;
  /* pare-chevauchement : jamais deux mélodies à moins de 800 ms (sauf test) */
  const maintenant = Date.now();
  if (!force && maintenant - dernierSon < 800) return;
  dernierSon = maintenant;
  if (niveau === 'urgent')      { bipe(880, 0, .17, .32); bipe(988, .21, .17, .32); bipe(1175, .42, .22, .32); }
  else if (niveau === 'alerte') { bipe(660, 0, .15, .28); bipe(523, .19, .22, .28); }
  else                          { bipe(587, 0, .14, .22); }
}

     <div class="notif-list">${list.length ? list.map(n =>
        `<div class="notif-item ${n.lu?'':'unread'} ${n.niveau || 'info'}"${n.requestId ? ` data-act="notif-open" data-nid="${n.id}" data-id="${n.requestId}" title="Ouvrir la demande"` : ''}>
